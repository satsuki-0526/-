<!doctype html><html lang="ja"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>手帳家計簿</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="家計簿"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#F7F0E0"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"></head><body>
<title>手帳家計簿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
  /* Layout: 一画面完結のノート。上に見出し、中央が罫線入りのページ(スクロール)、下に6つの付箋タブ。記録の入力は下から出る書き込みシート。 */
  :root {
    --paper: #F7F0E0;
    --paper-deep: #EDE1C8;
    --card: #FFFBF2;
    --ink: #4B3B2D;
    --ink-soft: #7C664F;
    --line: #E1D2B6;
    --rule: #EBE0CA;
    --margin: #EBC3B8;
    --income: #4F7042;
    --spend: #A4543F;
    --plan: #4C6D83;
    --warn: #A8730F;
    --over: #A93A2B;
    --note-yellow: #F5E3A3;
    --note-pink: #F3D3C8;
    --note-green: #D4E1C4;
    --note-blue: #D1E0E6;
    --tape: rgba(212, 178, 134, .6);
    --btn: #7A5A3F;
    --btn-ink: #FFF8EA;
    --scrim: rgba(60, 44, 30, .5);
    --shadow: 0 1px 0 rgba(75, 59, 45, .08), 0 8px 14px -10px rgba(75, 59, 45, .45);
    --font-display: "Klee One", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c-other: #9C8F7C;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #241E18; --paper-deep: #3A3027; --card: #332A21; --ink: #F1E6D3; --ink-soft: #C2AE96;
      --line: #4A3E31; --rule: #2E261F; --margin: #6B4A41;
      --income: #A5CC94; --spend: #EFA390; --plan: #9CC0D5; --warn: #E7B866; --over: #F28D7E;
      --note-yellow: #5B4F2B; --note-pink: #5F3C34; --note-green: #3C4B34; --note-blue: #35454F;
      --tape: rgba(160, 130, 90, .5); --btn: #D2A57A; --btn-ink: #2A1F15; --scrim: rgba(0, 0, 0, .6);
      --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 14px -10px rgba(0, 0, 0, .7);
      --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c-other: #9A8B76;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #241E18; --paper-deep: #3A3027; --card: #332A21; --ink: #F1E6D3; --ink-soft: #C2AE96;
    --line: #4A3E31; --rule: #2E261F; --margin: #6B4A41;
    --income: #A5CC94; --spend: #EFA390; --plan: #9CC0D5; --warn: #E7B866; --over: #F28D7E;
    --note-yellow: #5B4F2B; --note-pink: #5F3C34; --note-green: #3C4B34; --note-blue: #35454F;
    --tape: rgba(160, 130, 90, .5); --btn: #D2A57A; --btn-ink: #2A1F15; --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 14px -10px rgba(0, 0, 0, .7);
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c-other: #9A8B76;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background-color: var(--paper);
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--rule) 31px, var(--rule) 32px);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
    display: flex;
    justify-content: center;
    -webkit-text-size-adjust: 100%;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--plan); outline-offset: 2px; }

  .app { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; position: relative; }
  .app::before { content: ""; position: absolute; top: 0; bottom: 0; left: -8px; width: 2px; background: var(--margin); opacity: .8; }

  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 14px 2px 10px; }
  .eyebrow { margin: 0; font-size: 12px; letter-spacing: .12em; color: var(--ink-soft); }
  h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 28px; line-height: 1.2; text-wrap: balance; }
  #banner:empty { display: none; }
  #banner { padding: 2px 2px 8px; }

  main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 6px 4px 24px; margin-inline: -4px; }
  .screen { display: flex; flex-direction: column; gap: 18px; }

  h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 18px; line-height: 1.3; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .sub { color: var(--ink-soft); font-size: 13px; }

  .num { font-variant-numeric: tabular-nums; font-weight: 700; letter-spacing: -.01em; }
  .unit { font-size: .55em; font-weight: 500; margin-left: 2px; }
  .big { font-size: clamp(38px, 12vw, 50px); line-height: 1.1; }
  .mid { font-size: 22px; line-height: 1.2; }

  .card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
  .note { position: relative; border-radius: 4px 4px 12px 4px; padding: 14px 14px 16px; box-shadow: var(--shadow); color: var(--ink); }
  .note.y { background: var(--note-yellow); transform: rotate(-.6deg); }
  .note.g { background: var(--note-green); transform: rotate(.5deg); }
  .note.p { background: var(--note-pink); transform: rotate(-.4deg); }
  .note.b { background: var(--note-blue); transform: rotate(.6deg); }
  .taped::before { content: ""; position: absolute; top: -9px; left: 50%; width: 60px; height: 16px; background: var(--tape); transform: translateX(-50%) rotate(-3deg); border-radius: 2px; }
  .label { margin: 0; font-size: 13px; font-weight: 500; letter-spacing: .04em; }

  .trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .trio .note { padding: 12px 10px 14px; }
  .trio .num { font-size: 19px; display: block; margin-top: 2px; }

  .formula { margin: 12px 0 0; padding: 12px 0 0; border-top: 2px dashed var(--line); display: grid; gap: 2px; font-size: 14px; }
  .formula div { display: flex; justify-content: space-between; gap: 8px; }
  .formula .num { font-weight: 500; }
  .formula .hint { color: var(--ink-soft); font-size: 12px; margin-top: 6px; }

  .list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
  .list > li { border-top: 1px solid var(--line); }
  .list > li:first-child { border-top: 0; }
  .row { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 56px; padding: 8px 0; width: 100%; text-align: left; background: none; border: 0; cursor: pointer; }
  .row .d { font-size: 12px; color: var(--ink-soft); line-height: 1.3; }
  .row .t { min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; }
  .row .t b { flex-basis: 100%; font-weight: 500; overflow-wrap: anywhere; }
  .row .amt { font-size: 17px; text-align: right; }
  .row .amt.in { color: var(--income); }
  .row .amt.out { color: var(--spend); }
  .chip { display: inline-flex; align-items: center; min-height: 20px; padding: 0 8px; border-radius: 6px; font-size: 11px; font-weight: 500; background: var(--paper-deep); color: var(--ink); white-space: nowrap; }
  .chip.plan { background: var(--note-blue); }
  .chip.warn { background: var(--note-yellow); }
  .chip.over { background: var(--note-pink); }
  .chip.ok { background: var(--note-green); }

  .tips { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .tips li { padding-left: 22px; position: relative; }
  .tips li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink-soft); }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; border-radius: 14px; background: var(--paper-deep); }
  .seg.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .seg button { min-height: 44px; border: 0; border-radius: 10px; background: transparent; font-weight: 500; cursor: pointer; }
  .seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--card); box-shadow: var(--shadow); font-weight: 700; }

  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; padding: 0 18px; border: 0; border-radius: 14px; background: var(--btn); color: var(--btn-ink); font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: var(--shadow); }
  .btn.ghost { min-height: 48px; background: transparent; color: var(--ink); border: 1.5px solid var(--ink-soft); box-shadow: none; font-size: 15px; }
  .btn.danger { color: var(--over); border-color: var(--over); }
  .btn.small { width: auto; min-height: 44px; font-size: 14px; padding: 0 16px; }

  .month { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .month h2 { text-align: center; flex: 1; }
  .month button { min-width: 52px; min-height: 44px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); font-size: 18px; cursor: pointer; }

  .empty { text-align: center; padding: 26px 16px; border: 2px dashed var(--line); border-radius: 14px; color: var(--ink-soft); display: grid; gap: 14px; justify-items: center; }
  .empty p { margin: 0; }

  .plan-item { display: grid; gap: 8px; padding: 14px 0; border-top: 1px solid var(--line); }
  .plan-item:first-child { border-top: 0; padding-top: 0; }
  .plan-item:last-child { padding-bottom: 0; }
  .plan-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .plan-head b { font-weight: 500; overflow-wrap: anywhere; }
  .plan-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 13px; color: var(--ink-soft); }
  .plan-actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .memo { margin: 0; font-size: 13px; color: var(--ink-soft); overflow-wrap: anywhere; }
  details.card summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-family: var(--font-display); font-weight: 600; }
  details.card[open] summary { margin-bottom: 8px; }

  .track { height: 12px; border-radius: 8px; background: var(--paper-deep); overflow: hidden; }
  .fill { height: 100%; border-radius: 8px; background: var(--plan); }
  .bar-row { display: grid; gap: 4px; padding: 8px 0; }
  .bar-row .line1 { display: flex; justify-content: space-between; gap: 8px; }

  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; padding: 10px 0; }
  .set-row b { display: block; font-weight: 500; }
  .set-row small { color: var(--ink-soft); font-size: 12px; line-height: 1.4; display: block; }
  .plain { margin: 8px 0 0; padding-left: 1.2em; display: grid; gap: 6px; font-size: 14px; }

  .tabs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 2px; padding: 6px; margin: 6px 0 8px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }
  .tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 58px; border: 0; border-radius: 14px; background: transparent; color: var(--ink-soft); font-size: 11px; font-weight: 500; cursor: pointer; }
  .tabs button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tabs button[aria-current="page"] { background: var(--note-yellow); color: var(--ink); font-weight: 700; }

  /* hidden のものは、どんな環境でも必ず隠す */
  [hidden] { display: none !important; }

  /* 書き込みシート */
  .sheet-wrap { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { position: relative; width: 100%; max-width: 480px; max-height: 94%; overflow-y: auto; overscroll-behavior: contain; background: var(--card); border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0; padding-top: 22px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
  .sheet::before { content: ""; position: absolute; top: 8px; left: 50%; width: 44px; height: 5px; border-radius: 3px; background: var(--line); transform: translateX(-50%); }
  .field { display: grid; gap: 6px; }
  .field > label, .field > .lab { font-size: 13px; font-weight: 500; color: var(--ink-soft); }
  .field input, .field select, .field textarea { width: 100%; min-height: 50px; padding: 10px 12px; font-size: 16px; color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; }
  .field textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
  .field select { -webkit-appearance: none; appearance: none; padding-right: 38px; background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px, 6px 6px; background-repeat: no-repeat; }
  .field input.amount-input { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; min-height: 60px; }
  .field input[aria-invalid="true"], .field select[aria-invalid="true"] { border-color: var(--over); }
  .amt-preview { min-height: 1.4em; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .err { color: var(--over); font-size: 13px; font-weight: 500; }
  .err:empty { display: none; }
  .actions { display: grid; gap: 10px; margin-top: 4px; }

  .amt-row { display: flex; gap: 8px; align-items: stretch; }
  .amt-row input { flex: 1; min-width: 0; }
  .amt-row .calc-open { width: auto; flex: none; min-height: 60px; padding: 0 16px; font-size: 15px; }
  .calc-display { background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 14px 12px; text-align: right; }
  .calc-expr { min-height: 1.6em; font-size: 15px; color: var(--ink-soft); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .calc-result { font-size: 34px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .keys { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .key { min-height: 58px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--paper); font-size: 22px; font-weight: 500; cursor: pointer; font-variant-numeric: tabular-nums; }
  .key.op { background: var(--note-yellow); }
  .key.fn { background: var(--paper-deep); font-size: 18px; }
  .key.eq { grid-row: span 2; background: var(--btn); color: var(--btn-ink); border-color: transparent; font-weight: 700; }
  .cat-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 56px; padding: 8px 0; border: 0; background: none; text-align: left; cursor: pointer; }
  .cat-row b { display: block; font-weight: 500; overflow-wrap: anywhere; }
  .cat-row small { color: var(--ink-soft); font-size: 12px; }
  .cat-row .chev { color: var(--ink-soft); font-size: 22px; }
  #f-copy { font-family: ui-monospace, Menlo, monospace; font-size: 13px; min-height: 180px; }
  #f-text { font-size: 14px; min-height: 120px; }
  .field input[type="file"] { min-height: 52px; padding: 12px; font-size: 15px; }
  .budget { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
  .budget:first-child { border-top: 0; padding-top: 0; }
  .budget-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .budget-top .name { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
  .budget .fill { background: var(--income); }
  .budget .fill.near { background: var(--warn); }
  .budget .fill.over { background: var(--over); }
  .budget-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink-soft); }
  .budget-meta .num { font-weight: 500; color: var(--ink); }
  .kv { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .kv:first-child { border-top: 0; }
  .kv > span:first-child { min-width: 0; overflow-wrap: anywhere; }
  .amt-row select { flex: 1; min-width: 0; }
  .cat-row small { display: block; }
  /* 分析(円グラフ・棒グラフ) */
  .an-expense { --kind: var(--spend); }
  .an-income { --kind: var(--income); }
  .an-plan { --kind: var(--plan); }
  .presets { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .presets button { min-height: 44px; padding: 0 4px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); font-size: 13px; font-weight: 500; cursor: pointer; }
  .presets button[aria-pressed="true"] { background: var(--note-yellow); border-color: transparent; font-weight: 700; }
  .range-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .range-fields input { min-width: 0; font-size: 16px; }
  .donut { position: relative; width: min(100%, 220px); aspect-ratio: 1; margin: 4px auto 10px; }
  .donut svg { display: block; width: 100%; height: 100%; }
  .donut-c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0 27%; text-align: center; pointer-events: none; }
  .dc-l { max-width: 100%; font-size: 12px; line-height: 1.3; color: var(--ink-soft); overflow-wrap: anywhere; }
  .dc-n { font-size: clamp(15px, 5vw, 19px); line-height: 1.2; overflow-wrap: anywhere; }
  .an-row { display: grid; gap: 8px; width: 100%; min-height: 52px; padding: 10px 8px; border: 0; border-radius: 10px; background: none; text-align: left; cursor: pointer; }
  .an-row[aria-pressed="true"] { background: var(--paper-deep); }
  .an-line { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .an-line .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--dot); }
  .an-line .nm { flex: 1; min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
  .an-line .ct { margin-left: 6px; font-size: 11px; font-weight: 400; color: var(--ink-soft); white-space: nowrap; }
  .an-line .num { flex: none; font-size: 16px; white-space: nowrap; }
  .an-line .pc { flex: none; min-width: 3em; text-align: right; font-size: 12px; color: var(--ink-soft); }
  .an-row .track { display: block; }
  .an-row .fill { display: block; background: var(--dot); }
  .cols { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
  .col { display: grid; grid-template-rows: 16px 100px auto; justify-items: center; gap: 2px; width: 100%; min-height: 44px; padding: 6px 0 8px; border: 0; border-radius: 10px; background: none; cursor: pointer; }
  .col[aria-pressed="true"] { background: var(--paper-deep); }
  .col .cv { font-size: 11px; font-weight: 700; line-height: 16px; white-space: nowrap; }
  .col .well { display: flex; align-items: flex-end; justify-content: center; width: 100%; height: 100px; border-bottom: 1px solid var(--line); }
  .col .bar { display: block; width: min(24px, 70%); border-radius: 4px 4px 0 0; background: var(--kind); opacity: .36; }
  .col[data-in="1"] .bar { opacity: 1; }
  .col .mo { font-size: 11px; color: var(--ink-soft); }
  .tbl summary { display: flex; align-items: center; min-height: 44px; cursor: pointer; font-size: 13px; color: var(--ink-soft); }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); transform: translateX(-50%); max-width: min(92vw, 420px); padding: 12px 16px; border-radius: 12px; background: var(--ink); color: var(--paper); font-size: 14px; text-align: center; box-shadow: var(--shadow); z-index: 30; }
  /* 手帳(月間カレンダーと日付のメモ) */
  .cal-card { margin-top: 8px; padding: 22px 6px 10px; }

<script>
  /* ============ データの形 ============
     state = { version: 1, categories: [{id, name, kind}], records: [...] }
     records の type は 'expense'(使った) / 'income'(収入) / 'plan'(予定)
     記録にはカテゴリーの id と、その時点の名前(catName)を両方残します。
     予定を支払うと、予定 (status:'paid', expenseId) と、使った記録 (fromPlanId) がつながります。
     予定の status: 'unpaid'(未払い) / 'considering'(検討中) / 'paid'(支払い済み) / 'cancelled'(取り消し)。取り消した予定は、どの集計にも入りません。 */
  var KEY = 'kakeibo.v1';
  var EXPENSE_CATS = ['食費', '日用品', '交通費', '交際費', '推し活', '漫画・書籍', 'ライブ・イベント', '美容', '趣味', '固定費', 'その他'];
  var INCOME_CATS = ['アルバイト代', '臨時収入', 'その他'];
  var WEEK = ['日', '月', '火', '水', '木', '金', '土'];
  var MAX_AMOUNT = 99999999;
  var NOTE_MAX = 1000;
  var storageOK = true, loadProblem = false, recovered = false, persistAsked = false, saveBusy = false;

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(n) { return Math.abs(n).toLocaleString('ja-JP'); }
  function yen(n, cls) { return '<span class="num ' + (cls || '') + '">' + (n < 0 ? '−' : '') + fmt(n) + '<span class="unit">円</span></span>'; }
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function todayStr() { var t = new Date(); return t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate()); }
  function validDate(s) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return false;
    var p = s.split('-').map(Number), d = new Date(p[0], p[1] - 1, p[2]);
    return d.getFullYear() === p[0] && d.getMonth() === p[1] - 1 && d.getDate() === p[2];
  }
  function dlabel(s) {
    var p = s.split('-').map(Number), d = new Date(p[0], p[1] - 1, p[2]);
    var y = p[0] !== new Date().getFullYear() ? p[0] + '/' : '';
    return y + p[1] + '/' + p[2] + '（' + WEEK[d.getDay()] + '）';
  }
  function parseAmount(s) {
    var t = String(s || '').replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/[^\d]/g, '');
    return t ? Number(t) : NaN;
  }

  /* ============ 保存と読み込み ============ */
  function freshState() {
    var cats = [];
    EXPENSE_CATS.forEach(function (n, i) { cats.push({ id: 'x' + (i + 1), name: n, kind: 'expense' }); });
    INCOME_CATS.forEach(function (n, i) { cats.push({ id: 'i' + (i + 1), name: n, kind: 'income' }); });
    return { version: 1, categories: cats, records: [], fixed: [], budgets: [], notes: {}, settings: { periodStart: 15 } };
  }
  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { storageOK = false; return freshState(); }
    if (!raw) return freshState();
    try {
      var d = JSON.parse(raw);
      if (!d || d.version !== 1 || !Array.isArray(d.records) || !Array.isArray(d.categories)) throw new Error('bad');
      return d;
    } catch (e) {
      try { localStorage.setItem(KEY + '.broken', raw); } catch (e2) {}
      try {
        var pr = localStorage.getItem(KEY + '.prev');
        var pd = pr ? JSON.parse(pr) : null;
        if (pd && pd.version === 1 && Array.isArray(pd.records) && Array.isArray(pd.categories)) { recovered = true; return pd; }
      } catch (e3) {}
      loadProblem = true;
      return freshState();
    }
  }
  function save() {
    try {
      var next = JSON.stringify(state), cur = localStorage.getItem(KEY);
      if (cur && cur !== next) {
        try { var cj = JSON.parse(cur); if (cj && cj.version === 1 && Array.isArray(cj.records)) localStorage.setItem(KEY + '.prev', cur); } catch (e0) {}
      }

  }
  var state = normalizeState(load());
  var ui = { tab: 'home', kind: 'expense', catKind: 'expense', ym: null, sheet: null, opener: null };
  (function () { var p = periodOf(todayStr()); ui.ym = { y: p.y, m: p.m }; ui.budgetYm = { y: p.y, m: p.m }; ui.an = { mode: 'month', y: p.y, m: p.m, from: '', to: '', kind: 'expense', sel: null, bar: null, view: 'stats' }; ui.cal = { y: p.y, m: p.m, sel: todayStr() }; })();

  /* ============ 集計(画面とは独立した計算) ============ */
  function findRec(id) { for (var i = 0; i < state.records.length; i++) if (state.records[i].id === id) return state.records[i]; return null; }
  function recSort(a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : (b.createdAt || 0) - (a.createdAt || 0); }
  function sumOf(list) { return list.reduce(function (a, r) { return a + r.amount; }, 0); }
  function ymKey(y, m) { return y + '-' + pad(m); }

  /* ============ 集計の期間(給料日基準) ============
     1か月は「開始日(初期は15日)から、翌月の前の日まで」です。開始日が15なら、10月分は 10/15〜11/14。
     期間の名前は、はじまりの月で呼びます。開始日が1なら、ふつうの月(1日〜月末)と同じです。
     記録に入っているのは日付と金額だけで、どの期間に入るかは、表示するときに日付から計算します。
     だから開始日を変えても、入力した記録そのものは変わりません。 */
  function startDay() {
    var d = state.settings && state.settings.periodStart;
    return (typeof d === 'number' && Math.floor(d) === d && d >= 1 && d <= 28) ? d : 15;
  }
  function periodRange(y, m) {
    var s = startDay();
    if (s === 1) return { from: ymKey(y, m) + '-01', to: lastDayStr(y, m) };
    var ny = m === 12 ? y + 1 : y, nm = m === 12 ? 1 : m + 1;
    return { from: ymKey(y, m) + '-' + pad(s), to: ymKey(ny, nm) + '-' + pad(s - 1) };
  }
  function periodOf(date) {
    var y = Number(date.slice(0, 4)), m = Number(date.slice(5, 7)), d = Number(date.slice(8, 10));

  }
  function periodShift(p, n) { var t = p.y * 12 + (p.m - 1) + n; return { y: Math.floor(t / 12), m: ((t % 12) + 12) % 12 + 1 }; }
  function jpMD(str) { return Number(str.slice(5, 7)) + '/' + Number(str.slice(8, 10)); }
  function rangeText(r) { return jpMD(r.from) + '〜' + jpMD(r.to); }
  function periodLabel(y, m) { return y + '年' + m + '月分'; }
  function periodHead(y, m) { return periodLabel(y, m) + '<small class="prange">' + rangeText(periodRange(y, m)) + '</small>'; }
  function datesBetween(from, to) {
    var out = [], d = from, n = 0;
    while (d <= to && n < 400) { out.push(d); d = addDays(d, 1); n++; }
    return out;
  }
  function periodCardHtml() {
    var s = startDay(), cp = periodOf(todayStr()), opts = '', i;
    for (i = 1; i <= 28; i++) opts += opt(i, i === 1 ? '1日（ふつうの月：1日〜月末）' : i + '日（翌月' + (i - 1) + '日まで）', s);
    return '<div class="card"><div class="sec-head"><h2>集計の期間</h2><span class="sub">給料日に合わせる</span></div>' +
      '<div class="field"><label for="f-pstart">1か月のはじまりの日</label><select id="f-pstart" data-setting="periodStart">' + opts + '</select></div>' +
      '<p class="sub" style="margin:10px 0 0">今は、毎月' + s + '日から' + (s === 1 ? '月末' : '翌月' + (s - 1) + '日') + 'までを1か月として数えています。今の期間は<b>' + cp.m + '月分（' + rangeText(periodRange(cp.y, cp.m)) + '）</b>です。</p>' +
      '<p class="sub" style="margin:6px 0 0">あとから変えても、入力した記録の日付や金額は変わりません。どの月分に入るかの区切りだけが変わります。予算は「○月分」ごとのまま残ります。</p></div>';
  }
  // 画面が見ている期間を、「今の期間」にそろえる(開始日を変えた・復元したあと用)
  function resetPeriodUi() {
    var cp = periodOf(todayStr());
    ui.ym = { y: cp.y, m: cp.m }; ui.budgetYm = { y: cp.y, m: cp.m };
    ui.an.y = cp.y; ui.an.m = cp.m; ui.an.sel = null; ui.an.bar = null;
    ui.cal = { y: cp.y, m: cp.m, sel: todayStr() };
  }
  function applyPeriodStart(n) {
    if (!(n >= 1 && n <= 28) || Math.floor(n) !== n) return;
    state.settings.periodStart = n;
    resetPeriodUi();
    save(); render();
    var el = $('f-pstart'); if (el && el.focus) el.focus();
    toast(storageOK ? '集計の開始日を毎月' + n + '日にしました。記録は変わっていません' : '変更しましたが、保存できていません');
  }
  function ofType(type, y, m) {
    var pr = m == null ? null : periodRange(y, m);   // 月ではなく「期間」で選ぶ
    return state.records.filter(function (r) { return r.type === type && (!pr || (r.date >= pr.from && r.date <= pr.to)); });
  }
  function isOpenPlan(r) { return r.type === 'plan' && r.status !== 'paid' && r.status !== 'cancelled'; }   // まだ払っていない、生きている予定
  function openPlans() { return state.records.filter(isOpenPlan); }
  function stats(y, m) {
    var end = periodRange(y, m).to;
    var inc = sumOf(ofType('income', y, m)), spent = sumOf(ofType('expense', y, m));
    var planned = sumOf(openPlans().filter(function (p) { return p.date <= end; }));
    return { income: inc, spent: spent, planned: planned, balance: inc - spent, free: inc - spent - planned };
  }
  function catTotals(y, m) {
    var map = {};
    ofType('expense', y, m).forEach(function (r) { map[r.catName] = (map[r.catName] || 0) + r.amount; });

  /* ============ 記録の追加・変更・削除 ============ */
  function catById(id) { for (var i = 0; i < state.categories.length; i++) if (state.categories[i].id === id) return state.categories[i]; return null; }

  function applyDraft(rec, d, amt) {

  }

  /* ============ 固定費と予算 ============

       予定には fixedId と occ(予定の日)がつき、同じ日の予定は二度作りません。
       genThrough は「ここまでは予定を作った」という印で、消した予定が作り直されないようにします。
     予算: { ym, total, cats } を月ごとに持ち、その月以降は、次の設定まで続きます。 */
  var MONTH_MAX = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

    if (!st.settings || typeof st.settings !== 'object' || Array.isArray(st.settings)) st.settings = {};
    var ps0 = st.settings.periodStart;   // 集計の開始日(1〜28)。初期は給料日の15日
    if (!(typeof ps0 === 'number' && Math.floor(ps0) === ps0 && ps0 >= 1 && ps0 <= 28)) st.settings.periodStart = 15;
    if (st.settings.cherished !== undefined && !(Array.isArray(st.settings.cherished) && st.settings.cherished.every(function (x) { return typeof x === 'string'; }))) delete st.settings.cherished;   // 大切にしている支出(カテゴリーid)。未設定なら初期の目安を使う

  function parseD(str) { var p = str.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }

  // afterExcl の翌日から through まで(through を含む)の予定の日を返します
  function fxOccurrences(fx, afterExcl, through) {

      while (wd.getDay() !== fx.wday) wd.setDate(wd.getDate() + 1);
      while (fmtD(wd) <= hi && out.length < 400) { out.push(fmtD(wd)); wd.setDate(wd.getDate() + 7); }
    } else if (fx.cycle === 'yearly') {
      for (y = a.getFullYear(); y <= b.getFullYear(); y++) {
        o = y + '-' + pad(fx.ymonth) + '-' + pad(clampDay(y, fx.ymonth, fx.yday));
        if (o > lo && o <= hi) out.push(o);
      }
    } else {
      y = a.getFullYear(); m = a.getMonth() + 1;
      while ((y < b.getFullYear() || (y === b.getFullYear() && m <= b.getMonth() + 1)) && out.length < 400) {
        o = y + '-' + pad(m) + '-' + pad(clampDay(y, m, fx.day));

  // 動いている固定費について、今日から約1か月先までの予定を作ります。今月より前にはさかのぼりません。
  function generateFixed() {

        if (exists) return;

    return 'この期間の予定 ' + fmt(planned) + '円（' + plans.length + '件）・支払い済み ' + fmt(actual) + '円（' + paid.length + '件）';
  }
  function fixedCardHtml() {

      return '<li><button type="button" class="cat-row" data-action="fixed-edit" data-id="' + esc(fx.id) + '"><span><b>' + esc(fx.name) + '</b>' +
        '<small>' + cycleText(fx) + '・' + fmt(fx.amount) + '円・' + esc(fx.catName) + '</small><small>' + fixedMonthText(fx) + '</small></span>' +
        '<span style="display:flex;align-items:center;gap:6px">' + chip + '<span class="chev" aria-hidden="true">›</span></span></button></li>';
    }).join('');
    return '<div class="card"><div class="sec-head"><h2>固定費</h2><span class="sub">家賃・サブスクなど</span></div>' +
      '<p class="sub" style="margin:0 0 8px">日が近づくと「予定」に自動で入ります。実際に払ったら、予定タブで「支払い済みにする」を押してください。</p>' +

  function opt(v, label, cur) { return '<option value="' + v + '"' + (String(cur) === String(v) ? ' selected' : '') + '>' + label + '</option>'; }
  function newFixedDraft() {

  function renderFixedSheet(focusSel) {

  function submitFixed(d) {

  function budgetRowsHtml(rows) {

      (paid.length || open.length || canc.length ? '<button type="button" class="btn ghost" data-action="open-compare">予定と実際を比べる（分析へ）</button>' : '');

  /* ============ 分析(集計とグラフ) ============
     3種類は、混ぜずに別々に集計します。
       使ったお金 … 実際に払ったお金です(予定を「支払い済み」にした分も、ここに入ります)
       収入       … 収入の記録です
       予定       … まだ払っていない予定(未払い・検討中)を、予定の日で数えます。
                     支払い済みの予定は「使ったお金」に入っているので、ここでは数えません(二重にしません)。
     円グラフは、その期間に金額が多い5つのカテゴリーに色をつけ、残りは「ほか」の灰色にまとめます。
     名前・金額・割合は、色に頼らず、いつも文字でも出します。 */
  /* ============ 予定と実際の比較 ============
     予定(plan)ひとつごとに、実際に払った記録(expense, plan.expenseId でつながる)と比べます。
       差額 = 予定の金額 − 実際の金額  (プラスなら予定より安い、マイナスなら予定より高い)
     種類: 支払い済み(予定と実際を比べる) / 未購入(まだ払っていない。比べない) / 取り消し(どこにも数えない)
     支払い済みの分は、実際に払った日(使ったお金の日付)の期間に入れます。未購入・取り消しは予定の日で数えます。
     「実際」には、予定から作った使ったお金の記録だけを使うので、二重には数えません。 */
  function cmpItems() {
    var out = [];
    state.records.forEach(function (p) {
      if (p.type !== 'plan') return;
      var nm = p.name || p.catName;
      if (p.status === 'paid') {
        var e = findRec(p.expenseId);
        if (!e || e.type !== 'expense') return;
        out.push({ kind: 'paid', plan: p, exp: e, date: e.date, cat: e.catName, name: nm, planned: p.amount, actual: e.amount, diff: p.amount - e.amount });
      } else {
        out.push({ kind: p.status === 'cancelled' ? 'cancelled' : 'open', plan: p, date: p.date, cat: p.catName, name: nm, planned: p.amount, actual: 0, diff: 0 });
      }
    });
    return out;
  }
  function cmpIn(items, from, to) { return items.filter(function (it) { return it.date >= from && it.date <= to; }); }
  function cmpCalc(items) {
    var c = { paid: [], open: [], canc: [], pl: 0, ac: 0, diff: 0, cheap: 0, pricy: 0, same: 0, openSum: 0, cancSum: 0 };
    items.forEach(function (it) {
      if (it.kind === 'paid') { c.paid.push(it); c.pl += it.planned; c.ac += it.actual; if (it.diff > 0) c.cheap++; else if (it.diff < 0) c.pricy++; else c.same++; }
      else if (it.kind === 'open') { c.open.push(it); c.openSum += it.planned; }
      else { c.canc.push(it); c.cancSum += it.planned; }
    });
    c.diff = c.pl - c.ac;
    return c;
  }
  function diffChip(d, short) {
    if (d > 0) return '<span class="chip ok">▼ 予定より' + (short ? '' : fmt(d) + '円') + '安い</span>';
    if (d < 0) return '<span class="chip over">▲ 予定より' + (short ? '' : fmt(-d) + '円') + '高い</span>';
    return '<span class="chip">予定どおり</span>';
  }
  function diffCell(d) { return d > 0 ? '<span class="df good">▼' + fmt(d) + '</span>' : d < 0 ? '<span class="df bad">▲' + fmt(-d) + '</span>' : '<span class="df">±0</span>'; }
  function cmpBlockHtml(planned, actual) {
    var d = planned - actual;
    return '<div><span>予定金額</span>' + yen(planned) + '</div><div><span>実際の支出</span>' + yen(actual) + '</div>' +
      '<div style="margin-top:6px;padding-top:8px;border-top:2px dashed var(--line);align-items:center"><span><b>差額</b> ' + diffChip(d, true) + '</span>' + yen(Math.abs(d), 'mid') + '</div>';
  }
  function cmpRowHtml(label, sub, pl, ac, dcell, cls) {
    return '<div class="cmp-r' + (cls ? ' ' + cls : '') + '"><span>' + label + (sub ? '<small class="cmp-sub">' + sub + '</small>' : '') + '</span><span>' + pl + '</span><span>' + ac + '</span><span>' + dcell + '</span></div>';
  }
  function cmpItemRowHtml(it) {
    var nm = esc(it.name), cat = '<span class="chip">' + esc(it.cat) + '</span>';
    if (it.kind === 'paid') {
      return '<li><button type="button" class="row" data-action="edit" data-id="' + it.plan.id + '"><span class="d">' + dlabel(it.date) + '</span><span class="t"><b>' + nm + '</b>' + cat + diffChip(it.diff) + '</span>' +
        '<span class="amt out">' + yen(it.actual) + '<small class="cmp-sub">予定 ' + fmt(it.planned) + '円</small></span></button></li>';
    }
    if (it.kind === 'open') {
      return '<li><button type="button" class="row" data-action="edit" data-id="' + it.plan.id + '"><span class="d">' + dlabel(it.date) + '</span><span class="t"><b>' + nm + '</b>' + cat + '<span class="chip plan">未購入</span></span>' +
        '<span class="amt pl">' + yen(it.planned) + '<small class="cmp-sub">まだ払っていない</small></span></button></li>';
    }
    return '<li><button type="button" class="row" data-action="edit" data-id="' + it.plan.id + '"><span class="d">' + dlabel(it.date) + '</span><span class="t"><b>' + nm + '</b>' + cat + '<span class="chip">取り消し</span></span>' +
      '<span class="amt out cmp-x">' + yen(it.planned) + '<small class="cmp-sub" style="text-decoration:none">数えません</small></span></button></li>';
  }
  function compareHtml(rng, isMonth) {
    var a = ui.an, all = cmpItems(), items = cmpIn(all, rng.from, rng.to), c = cmpCalc(items);
    var title = isMonth ? periodLabel(a.y, a.m) + '（' + rangeText(rng) + '）' : jpDate(rng.from) + '〜' + jpDate(rng.to);
    var h = '';
    if (!items.length) {
      return '<div class="empty"><p>この期間には、予定の記録がありません。<br>「予定」タブで予定を作って、買ったときに「支払い済みにする」を押すと、ここで予定と実際を比べられます。</p></div>';
    }
    h += '<div class="card"><div class="sec-head" style="flex-wrap:wrap"><h2>予定と実際</h2><span class="sub">' + title + '</span></div>';
    if (c.paid.length) {
      h += '<div class="formula" style="margin:0;padding:0;border-top:0">' + cmpBlockHtml(c.pl, c.ac) + '</div>' +
        '<p class="sub" style="margin:10px 0 0">買った予定 ' + c.paid.length + '件：予定より安かった ' + c.cheap + '件・高かった ' + c.pricy + '件・予定どおり ' + c.same + '件</p>';
    } else h += '<p class="sub" style="margin:0">この期間に、支払い済みにした予定はまだありません。</p>';
    h += '<div class="formula" style="margin-top:10px">' +
      (c.open.length ? '<div><span>まだ買っていない予定（' + c.open.length + '件）</span>' + yen(c.openSum) + '</div>' : '') +
      (c.canc.length ? '<div><span>取り消した予定（' + c.canc.length + '件）</span>' + yen(c.cancSum) + '</div>' : '') +
      '<p class="hint">「実際の支出」は、予定から支払い済みにした記録だけの合計です。まだ買っていない予定と、取り消した予定は、実際の支出には入れていません。支払い済みの分は、実際に払った日で期間を分けています。</p></div></div>';

    // カテゴリー別
    var map = Object.create(null), order = [];
    items.forEach(function (it) {
      if (it.kind === 'cancelled') return;
      var k = it.cat || 'その他';
      if (!map[k]) { map[k] = { name: k, pl: 0, ac: 0, n: 0, open: 0, openN: 0 }; order.push(k); }
      var m = map[k];
      if (it.kind === 'paid') { m.pl += it.planned; m.ac += it.actual; m.n++; } else { m.open += it.planned; m.openN++; }
    });
    var cats = order.map(function (k) { return map[k]; }).sort(function (p, q) { return Math.abs(q.pl - q.ac) - Math.abs(p.pl - p.ac) || (p.name < q.name ? -1 : 1); });
    if (cats.length) {
      h += '<div class="card"><div class="sec-head"><h2>カテゴリー別</h2><span class="sub">円</span></div>' + cmpRowHtml('カテゴリー', '', '予定', '実際', '差額', 'h') +
        cats.map(function (m) {
          var sub = (m.n ? m.n + '件' : '') + (m.openN ? (m.n ? '・' : '') + '未購入 ' + fmt(m.open) + '円' : '');
          return m.n ? cmpRowHtml(esc(m.name), sub, fmt(m.pl), fmt(m.ac), diffCell(m.pl - m.ac)) : cmpRowHtml(esc(m.name), sub, '—', '—', '—');
        }).join('') +
        '<p class="sub" style="margin:8px 0 0">差額：<b>▼</b>予定より安い　<b>▲</b>予定より高い。買った予定だけを比べています。</p></div>';
    }

    // 月(期間)ごと
    var end = periodOf(rng.to), rows = '', i;
    for (i = 0; i < 6; i++) {
      var p = periodShift(end, i - 5), pr = periodRange(p.y, p.m), cc = cmpCalc(cmpIn(all, pr.from, pr.to));
      var on = pr.from <= rng.to && pr.to >= rng.from;
      var sub = (cc.paid.length ? cc.paid.length + '件' : '') + (cc.open.length ? (cc.paid.length ? '・' : '') + '未購入 ' + fmt(cc.openSum) + '円' : '');
      rows += cc.paid.length ? cmpRowHtml(p.m + '月分', sub, fmt(cc.pl), fmt(cc.ac), diffCell(cc.diff), on ? 'on' : '')
        : cmpRowHtml(p.m + '月分', sub, '—', '—', '—', on ? 'on' : '');
    }
    h += '<div class="card"><div class="sec-head"><h2>月ごと</h2><span class="sub">1か月（期間）ぶん・円</span></div>' + cmpRowHtml('期間', '', '予定', '実際', '差額', 'h') + rows +
      '<p class="sub" style="margin:8px 0 0">背景がついている行が、選んでいる期間です。</p></div>';

    // 1件ずつ
    var list = items.slice().sort(function (p, q) { return p.date < q.date ? 1 : p.date > q.date ? -1 : 0; });
    h += '<div class="card"><div class="sec-head"><h2>1件ずつ</h2><span class="sub">タップで金額・日付を直せます</span></div><ul class="list">' + list.map(cmpItemRowHtml).join('') + '</ul></div>';
    return h;
  }

  /* ============ 節約のヒント(ルールで計算する分析。外部のサービスは使いません) ============
     この端末の記録だけを使って、その場で計算します。通信も、AIも、追加の費用もありません。
     守っているルール:
       ・増えた=無駄遣い、とは決めません。増えた事実と金額だけを出します。
       ・「大切にしている支出」(初期は 推し活・趣味・交際費・ライブ・イベント・漫画・書籍。設定で変えられます)は、節約の対象にしません。
       ・食費・日用品・交通費・固定費は「必要な支出」として、減らす提案をしません。
       ・記録にない理由は推測しません。節約の見込み額には、必ず計算の式をつけます。
       ・記録が少ないときは、提案を控えます。 */
  var ESSENTIAL_NAMES = ['食費', '日用品', '交通費', '固定費'];
  var CHERISH_NAMES = ['推し活', '趣味', '交際費', 'ライブ・イベント', '漫画・書籍'];
  function cherishedNames() {
    var c = state.settings.cherished, out = {};
    if (Array.isArray(c)) c.forEach(function (id) { var k = catById(id); if (k) out[k.name] = 1; });
    else CHERISH_NAMES.forEach(function (n) { out[n] = 1; });
    return out;
  }
  function toggleCherish(id) {
    var c = state.settings.cherished;
    if (!Array.isArray(c)) c = state.categories.filter(function (k) { return k.kind === 'expense' && CHERISH_NAMES.indexOf(k.name) >= 0; }).map(function (k) { return k.id; });
    var i = c.indexOf(id);
    if (i >= 0) c.splice(i, 1); else c.push(id);
    state.settings.cherished = c;
    save();
  }
  function isEssential(name) { return ESSENTIAL_NAMES.indexOf(name) >= 0; }
  function yenT(n) { return fmt(n) + '円'; }
  function pctChange(cur, prev) { return prev > 0 ? Math.round((cur - prev) / prev * 100) : null; }
  function chgText(d) { return d > 0 ? '＋' + fmt(d) : d < 0 ? '−' + fmt(-d) : '±0'; }

  // 今の期間と、ひとつ前の期間。途中の期間は、同じ日数ぶんで比べます(途中なのに先月の全部と比べて「少ない」と見えないように)
  function tipsPeriods(y, m) {
    var cur = periodRange(y, m), pp = periodShift({ y: y, m: m }, -1), prev = periodRange(pp.y, pp.m), today = todayStr();
    var inProg = today >= cur.from && today <= cur.to;
    var curTo = inProg ? today : cur.to;
    var n = datesBetween(cur.from, curTo).length;
    var prevTo = addDays(prev.from, n - 1); if (prevTo > prev.to) prevTo = prev.to;
    return { cur: { from: cur.from, to: curTo }, prev: { from: prev.from, to: prevTo }, curFull: cur, prevFull: prev, inProg: inProg, ended: today > cur.to, days: n, py: pp.y, pm: pp.m };
  }
  function tipsCats(P) {
    var A = anAggregate('expense', P.cur.from, P.cur.to), B = anAggregate('expense', P.prev.from, P.prev.to), map = Object.create(null), keys = [];
    A.cats.forEach(function (c) { map[c.name] = { name: c.name, cur: c.amount, curN: c.count, prev: 0, prevN: 0 }; keys.push(c.name); });
    B.cats.forEach(function (c) {
      if (!map[c.name]) { map[c.name] = { name: c.name, cur: 0, curN: 0, prev: 0, prevN: 0 }; keys.push(c.name); }
      map[c.name].prev = c.amount; map[c.name].prevN = c.count;
    });
    var rows = keys.map(function (k) { var r = map[k]; r.d = r.cur - r.prev; return r; }).sort(function (p, q) { return Math.abs(q.d) - Math.abs(p.d) || (p.name < q.name ? -1 : 1); });
    return { rows: rows, curTotal: A.total, prevTotal: B.total, curN: A.count, prevN: B.count };
  }
  function biggestRec(name, from, to) {
    var best = null;
    state.records.forEach(function (r) { if (r.type === 'expense' && (r.catName || 'その他') === name && r.date >= from && r.date <= to && (!best || r.amount > best.amount)) best = r; });
    return best;
  }
  function fixedActive() { var t = todayStr(); return state.fixed.filter(function (fx) { return fx.active && !(fx.endDate && fx.endDate < t); }); }
  function fixedYear(fx) { return fx.amount * (fx.cycle === 'weekly' ? 52 : fx.cycle === 'yearly' ? 1 : 12); }
  function fixedBasis(fx) { return fx.amount.toLocaleString('ja-JP') + '円 × ' + (fx.cycle === 'weekly' ? '52週' : fx.cycle === 'yearly' ? '1回' : '12か月') + ' = ' + yenT(fixedYear(fx)); }

  function tipsCalc(tp) {
    var P = tipsPeriods(tp.y, tp.m), T = tipsCats(P), ch = cherishedNames();
    var prevFullN = anAggregate('expense', P.prevFull.from, P.prevFull.to).count;
    var fixed = fixedActive(), fy = 0;
    fixed.forEach(function (fx) { fy += fixedYear(fx); });
    return { tp: tp, P: P, T: T, ch: ch, prevFullN: prevFullN, enough: prevFullN >= 5 && T.curN >= 3 && P.days >= 7, brows: budgetRows(tp.y, tp.m), fixed: fixed, fixedYear: fy };
  }
  function tagChips(name, ch) { return (ch[name] ? '<span class="chip warn">大切にしている支出</span>' : '') + (isEssential(name) ? '<span class="chip plan">必要な支出</span>' : ''); }

  // 節約の提案(見込み額には、必ず計算の式をつける)
  function tipsList(C) {
    var out = [], T = C.T, P = C.P, ch = C.ch, span = P.inProg ? '今の期間のここまで（' + P.days + '日間）' : '今の期間';
    // a. 先月より増えた、大切でも必要でもないカテゴリー
    T.rows.forEach(function (r) {
      if (r.d <= 0 || ch[r.name] || isEssential(r.name)) return;
      var pc = pctChange(r.cur, r.prev);
      if (r.d < 1000 || pc === null || pc < 20) return;
      var big = biggestRec(r.name, P.cur.from, P.cur.to);
      out.push({ title: '「' + r.name + '」が先月より増えています',
        body: (P.inProg ? P.days + '日間で比べると、' : '') + '先月 ' + yenT(r.prev) + ' → 今月 ' + yenT(r.cur) + '（＋' + pc + '%）です。増えた理由は、記録からは分かりません。必要な買い物だったかもしれません。' + (big ? '今月いちばん大きい記録は「' + (big.name || big.catName) + '」' + yenT(big.amount) + '（' + jpMD(big.date) + '）です。' : '') + 'もし見直せそうなものがあれば、先月と同じ水準に戻すことが目安になります。',
        basis: ['今月 ' + yenT(r.cur) + ' − 先月 ' + yenT(r.prev) + ' = ' + yenT(r.d)], save: r.d, saveLabel: '見込める金額（最大）' });
    });
    // b. 予算を超えたカテゴリー
    (C.brows || []).forEach(function (r) {
      if (r.state !== 'over') return;
      var over = -r.left;
      if (r.overall) { out.push({ title: '全体の予算を超えています', body: '全体の予算 ' + yenT(r.budget) + ' に対して、使ったお金は ' + yenT(r.used) + ' です。カテゴリーごとの予算と、下の先月との比較を見て、どこを調整するか決めてみてください。', basis: ['使った ' + yenT(r.used) + ' − 予算 ' + yenT(r.budget) + ' = ' + yenT(over) + ' オーバー'], save: null }); return; }
      if (ch[r.label] || isEssential(r.label)) {
        out.push({ title: '「' + r.label + '」は予算を' + yenT(over) + '超えました', body: (ch[r.label] ? '大切にしている支出' : '必要な支出') + 'なので、無理に減らす必要はありません。今の使い方に予算の金額が合っているか、見直す選択肢もあります。', basis: ['使った ' + yenT(r.used) + ' − 予算 ' + yenT(r.budget) + ' = ' + yenT(over) + ' オーバー'], save: null });
      } else {
        out.push({ title: '「' + r.label + '」が予算を' + yenT(over) + '超えました', body: '次の期間に予算内に収めるなら、超えた分が目安になります。', basis: ['使った ' + yenT(r.used) + ' − 予算 ' + yenT(r.budget) + ' = ' + yenT(over)], save: over, saveLabel: '見込める金額（予算内にするなら）' });
      }
    });
    // c. 少額の支出が多いカテゴリー(大切でも必要でもないもの)
    T.rows.forEach(function (r) {
      if (ch[r.name] || isEssential(r.name) || r.curN < 5 || r.cur < 3000) return;
      var avg = Math.round(r.cur / r.curN);
      if (avg >= 1500) return;
      var s10 = Math.floor(r.cur * 0.1);
      out.push({ title: '「' + r.name + '」は、少額の支出が' + r.curN + '件あります', body: span + 'で、1件あたり平均 ' + yenT(avg) + ' です。小さな支出は気づきにくいので、まとめて買えるものがないか、振り返るきっかけにしてみてください。', basis: ['合計 ' + yenT(r.cur) + '（' + r.curN + '件）', 'もし1割を減らせたら：' + yenT(r.cur) + ' × 10% = ' + yenT(s10) + '（1割は目安の仮の数字です）'], save: s10, saveLabel: '見込める金額（目安）' });
    });
    // d. 固定費の見直し
    if (C.fixed.length) {
      var top = C.fixed.slice().sort(function (p, q) { return fixedYear(q) - fixedYear(p); }).slice(0, 3);
      out.push({ title: '固定費を、年間で見てみませんか', body: '固定費は毎回の支出が小さく見えても、1年だと大きな金額になります。続けるかどうかは、使い心地を知っているあなたにしか決められないので、候補は決めつけません。使っていないものがあれば、止めると下の金額が減ります。', basis: top.map(function (fx) { return fx.name + '：' + fixedBasis(fx); }), save: null });
    }
    // e. 予算が未設定
    if (!C.brows) out.push({ title: '予算を決めると、振り返りやすくなります', body: '設定でカテゴリーごとの予算を決めると、ここで「予算内か、超えたか」を見られます。大切にしている支出は、多めに決めても大丈夫です。', basis: [], save: null });
    return out;
  }

  function reportText(C) {
    var tp = C.tp, P = C.P, T = C.T, ch = C.ch, st = stats(tp.y, tp.m), lines = [];
    var curF = anAggregate('expense', P.curFull.from, P.curFull.to), inc = anAggregate('income', P.curFull.from, P.curFull.to);
    var head = periodLabel(tp.y, tp.m) + '（' + rangeText(P.curFull) + '）';
    lines.push('家計簿レポート　' + head);
    lines.push(P.ended ? '（この期間は終わりました）' : P.inProg ? '（途中経過：' + jpMD(P.cur.to) + 'まで）' : '（まだ始まっていない期間です）');
    lines.push('');
    lines.push('■ 収支');
    lines.push('収入 ' + yenT(inc.total) + ' − 使ったお金 ' + yenT(curF.total) + ' = ' + (inc.total - curF.total < 0 ? '−' : '') + yenT(Math.abs(inc.total - curF.total)));
    if (curF.count) lines.push('使った記録 ' + curF.count + '件。1日あたり平均 ' + yenT(Math.round(curF.total / Math.max(1, datesBetween(P.curFull.from, P.cur.to).length))) + '（' + datesBetween(P.curFull.from, P.cur.to).length + '日間）');
    lines.push('');
    lines.push('■ 使ったお金のカテゴリー（多い順）');
    if (!curF.cats.length) lines.push('記録がありません。');
    curF.cats.slice(0, 5).forEach(function (c) { lines.push(c.name + '　' + yenT(c.amount) + '（' + pctText(c.amount, curF.total) + '）' + (ch[c.name] ? '　※大切にしている支出' : '')); });
    var cherTotal = 0; curF.cats.forEach(function (c) { if (ch[c.name]) cherTotal += c.amount; });
    if (curF.total) lines.push('大切にしている支出の合計：' + yenT(cherTotal) + '（' + pctText(cherTotal, curF.total) + '）');
    lines.push('');
    lines.push('■ 先月との比べ方' + (P.inProg ? '（同じ' + P.days + '日間）' : ''));
    if (!T.prevN) lines.push('先月の記録がまだ少ないため、比べていません。');
    else {
      lines.push('先月 ' + yenT(T.prevTotal) + ' → 今月 ' + yenT(T.curTotal) + '（' + chgText(T.curTotal - T.prevTotal) + '円）');
      var up = T.rows.filter(function (r) { return r.d > 0; }).slice(0, 3), dn = T.rows.filter(function (r) { return r.d < 0; }).sort(function (p, q) { return p.d - q.d; }).slice(0, 3);
      if (up.length) lines.push('増えた：' + up.map(function (r) { return r.name + ' ' + chgText(r.d) + '円'; }).join('、'));
      if (dn.length) lines.push('減った：' + dn.map(function (r) { return r.name + ' ' + chgText(r.d) + '円'; }).join('、'));
      lines.push('増えたことは、悪いこととは限りません。');
    }
    lines.push('');
    lines.push('■ 予算');
    if (!C.brows) lines.push('予算は決まっていません。');
    else {
      var ov = C.brows.filter(function (r) { return r.state === 'over'; }), okr = C.brows.filter(function (r) { return r.state !== 'over'; });
      lines.push('超えた：' + (ov.length ? ov.map(function (r) { return r.label + ' ' + yenT(-r.left) + 'オーバー'; }).join('、') : 'なし'));
      lines.push('予算内：' + (okr.length ? okr.map(function (r) { return r.label + ' あと' + yenT(r.left); }).join('、') : 'なし'));
    }
    lines.push('');
    lines.push('■ 固定費');
    if (!C.fixed.length) lines.push('登録された固定費はありません。');
    else lines.push('月換算 ' + yenT(Math.round(C.fixedYear / 12)) + '、年間 ' + yenT(C.fixedYear) + '（' + C.fixed.length + '件）');
    lines.push('');
    lines.push('■ 予定');
    var cc = cmpCalc(cmpIn(cmpItems(), P.curFull.from, P.curFull.to));
    if (!cc.paid.length && !cc.open.length) lines.push('この期間の予定の記録はありません。');
    if (cc.paid.length) lines.push('買った予定 ' + cc.paid.length + '件：予定 ' + yenT(cc.pl) + ' に対して実際 ' + yenT(cc.ac) + '（差額 ' + yenT(Math.abs(cc.diff)) + (cc.diff > 0 ? '、予定より安い）' : cc.diff < 0 ? '、予定より高い）' : '）'));
    if (cc.open.length) lines.push('まだ買っていない予定 ' + cc.open.length + '件 ' + yenT(cc.openSum));
    lines.push('');
    var tips = tipsList(C).filter(function (t) { return t.save; });
    lines.push('■ 節約のヒント');
    if (!C.enough) lines.push('記録がまだ少ないため、提案は控えています。');
    else if (!tips.length) lines.push('いまのところ、お知らせしたい点はありません。');
    else tips.forEach(function (t) { lines.push('・' + t.title + '：' + t.basis.join('／') + '　→ ' + yenT(t.save)); });
    return lines.join('\n');
  }
  function reportFor() {
    var a = ui.an, rng = anRange(), tp = a.mode === 'month' ? { y: a.y, m: a.m } : periodOf(rng.ok ? rng.to : todayStr());
    return reportText(tipsCalc(tp));
  }

  function tipsHtml(rng, isMonth) {
    var a = ui.an, tp = isMonth ? { y: a.y, m: a.m } : periodOf(rng.to), C = tipsCalc(tp), P = C.P, T = C.T, ch = C.ch, h = '';
    var inN = P.inProg ? '（同じ' + P.days + '日間どうしで比べています）' : '';
    if (!isMonth) h += '<div class="note b flat">期間を自由に決めているので、いちばん後ろの期間（' + periodLabel(tp.y, tp.m) + '）で見ています。</div>';
    h += '<div class="note ' + (C.enough ? 'g' : 'y') + ' flat"><b>' + (C.enough ? 'このヒントについて' : '記録がまだ少ないようです') + '</b><br>' +
      (C.enough ? '記録からの計算だけで出しています。増えた=無駄遣い、とは決めません。「大切にしている支出」は節約の対象にせず、食費などの必要な支出は減らす提案をしません。' :
        '先月の「使った」記録が' + C.prevFullN + '件、今の期間が' + T.curN + '件（' + P.days + '日間）です。提案は、先月5件以上・今の期間3件以上・7日以上たってから出します。比べる表だけ出しています。') + '</div>';

    // 1・2 先月との比較
    h += '<div class="card"><div class="sec-head" style="flex-wrap:wrap"><h2>先月と比べる</h2><span class="sub">' + rangeText(P.cur) + ' と ' + rangeText(P.prev) + '</span></div>';
    if (inN) h += '<p class="sub" style="margin:0 0 6px">' + inN + '</p>';
    if (!T.rows.length) h += '<p class="sub" style="margin:0">どちらの期間にも、使った記録がありません。</p>';
    else {
      h += cmpRowHtml('カテゴリー', '', '先月', '今月', '増減', 'h') + T.rows.map(function (r) {
        return cmpRowHtml(esc(r.name), '', fmt(r.prev), fmt(r.cur), '<span class="chg">' + chgText(r.d) + '</span>');
      }).join('') + cmpRowHtml('合計', '', fmt(T.prevTotal), fmt(T.curTotal), '<span class="chg">' + chgText(T.curTotal - T.prevTotal) + '</span>', 'on');
      h += '<p class="sub" style="margin:8px 0 0">単位は円です。＋は先月より多い、−は少ないことを表します。</p>';
    }
    h += '</div>';
    var ups = T.rows.filter(function (r) { return r.d > 0; }).sort(function (p, q) { return q.d - p.d; });
    h += '<div class="card"><div class="sec-head"><h2>増えたカテゴリー</h2><span class="sub">' + ups.length + '個</span></div>';
    if (!ups.length) h += '<p class="sub" style="margin:0">先月より増えたカテゴリーはありません。</p>';
    else h += '<ul class="list">' + ups.map(function (r) {
      var pc = pctChange(r.cur, r.prev), big = biggestRec(r.name, P.cur.from, P.cur.to);
      return '<li class="tip"><h3>' + esc(r.name) + '</h3><div class="chips">' + tagChips(r.name, ch) + '</div>' +
        '<p>先月 ' + yenT(r.prev) + ' → 今月 ' + yenT(r.cur) + '（＋' + fmt(r.d) + '円' + (pc === null ? '、先月は記録なし' : '、＋' + pc + '%') + '）</p>' +
        (big ? '<p class="sub">今月いちばん大きい記録：「' + esc(big.name || big.catName) + '」' + yenT(big.amount) + '（' + jpMD(big.date) + '）</p>' : '') +
        '<p class="sub">' + (ch[r.name] ? '大切にしている支出なので、節約の対象にはしていません。' : isEssential(r.name) ? '必要な支出なので、減らすことはすすめません。' : '増えた理由は、記録からは分かりません。必要な買い物だったかもしれません。') + '</p></li>';
    }).join('') + '</ul>';
    h += '</div>';

    // 3・5 予算
    h += '<div class="card"><div class="sec-head"><h2>予算のようす</h2><span class="sub">' + periodLabel(tp.y, tp.m) + '</span></div>';
    if (!C.brows) h += '<p class="sub" style="margin:0">この期間には予算がありません。設定で決めると、ここに「超えた」「予算内」が出ます。</p>';
    else {
      var ov = C.brows.filter(function (r) { return r.state === 'over'; }), okr = C.brows.filter(function (r) { return r.state !== 'over'; });
      h += '<h3 style="margin:0 0 4px;font-family:var(--font-display);font-size:15px">予算を超えた（' + ov.length + '）</h3>' +
        (ov.length ? '<ul class="list">' + ov.map(function (r) { return '<li class="tip"><h3>' + esc(r.label) + ' <span class="chip over">超えました</span></h3><p>使った ' + yenT(r.used) + ' ／ 予算 ' + yenT(r.budget) + ' ／ <b>' + yenT(-r.left) + ' オーバー</b></p><div class="chips">' + (r.overall ? '' : tagChips(r.label, ch)) + '</div></li>'; }).join('') + '</ul>' : '<p class="sub" style="margin:0 0 8px">ありません。</p>') +
        '<h3 style="margin:10px 0 4px;font-family:var(--font-display);font-size:15px">予算内に収まっている（' + okr.length + '）</h3>' +
        (okr.length ? '<ul class="list">' + okr.map(function (r) { return '<li class="tip"><h3>' + esc(r.label) + ' ' + (r.state === 'near' ? '<span class="chip warn">もうすぐ</span>' : '<span class="chip ok">余裕あり</span>') + '</h3><p>使った ' + yenT(r.used) + ' ／ 予算 ' + yenT(r.budget) + ' ／ あと ' + yenT(r.left) + '（使用 ' + Math.round(r.rate * 100) + '%）</p></li>'; }).join('') + '</ul>' : '<p class="sub" style="margin:0">ありません。</p>');
      if (P.inProg) h += '<p class="sub" style="margin:8px 0 0">期間の途中なので、今の時点の金額です。</p>';
    }
    h += '</div>';

    // 4 固定費
    h += '<div class="card"><div class="sec-head"><h2>固定費</h2><span class="sub">月換算と年間</span></div>';
    if (!C.fixed.length) h += '<p class="sub" style="margin:0">動いている固定費は、まだ登録されていません。設定から登録できます。</p>';
    else {
      h += '<ul class="list">' + C.fixed.map(function (fx) { return '<li class="tip"><h3>' + esc(fx.name) + '</h3><p>' + cycleText(fx) + '　' + yenT(fx.amount) + '</p><p class="sub">年間：' + fixedBasis(fx) + '（月換算 約' + yenT(Math.round(fixedYear(fx) / 12)) + '）</p></li>'; }).join('') + '</ul>' +
        '<div class="formula"><div><span>月換算の合計</span>' + yen(Math.round(C.fixedYear / 12)) + '</div><div><span><b>年間換算の合計</b></span>' + yen(C.fixedYear, 'mid') + '</div>' +
        '<p class="hint">毎週のものは「×52週」、毎年のものは「1回」、毎月のものは「×12か月」で年間を計算しています。月換算は、年間を12で割った金額です。</p></div>';
    }
    h += '</div>';

    // 6・7 提案
    var list = tipsList(C);
    h += '<div class="card"><div class="sec-head"><h2>節約のヒント</h2><span class="sub">ルールで計算</span></div>';
    if (!C.enough) h += '<p class="sub" style="margin:0">記録がまだ少ないため、具体的な提案は控えています。記録がたまると、ここに出ます。</p>';
    else if (!list.length) h += '<p class="sub" style="margin:0">いまのところ、お知らせしたい点はありません。このままのペースで大丈夫そうです。</p>';
    else {
      h += '<ul class="list">' + list.map(function (t) {
        return '<li class="tip"><h3>' + esc(t.title) + '</h3><p>' + esc(t.body) + '</p>' +
          (t.basis.length ? '<div class="calc"><b>計算のもと</b>' + t.basis.map(function (b) { return '<span>' + esc(b) + '</span>'; }).join('') + '</div>' : '') +
          (t.save ? '<div class="save"><span><b>' + esc(t.saveLabel || '見込める金額') + '</b></span>' + yen(t.save, 'mid') + '</div>' : '') + '</li>';
      }).join('') + '</ul>' +
        '<p class="sub" style="margin:8px 0 0">見込める金額は、同じ支出を減らせた場合の目安です。内容が重なるものがあるので、合計は出していません。無理のない範囲で、できそうなものだけ試してください。</p>';
    }
    h += '</div>';

    // 大切にしている支出の設定
    var cats = state.categories.filter(function (c) { return c.kind === 'expense'; });
    h += '<details class="card"><summary>大切にしている支出を選ぶ</summary><p class="sub" style="margin:0 0 8px">ここで選んだカテゴリーは、節約の提案の対象にしません。（初めは、推し活・趣味・交際費・ライブ・イベント・漫画・書籍が選ばれています）</p><div class="chipwrap">' +
      cats.map(function (c) { return '<button type="button" class="chipbtn" data-action="an-cher" data-id="' + esc(c.id) + '" aria-pressed="' + (ch[c.name] ? 'true' : 'false') + '">' + esc(c.name) + '</button>'; }).join('') + '</div></details>';

    // 8 レポート
    var endish = P.ended || (P.inProg && Math.round((parseD(P.curFull.to) - parseD(todayStr())) / 86400000) <= 2);
    h += '<div class="card"><div class="sec-head"><h2>' + (endish ? '月末のレポート' : '途中経過のレポート') + '</h2><span class="sub">' + periodLabel(tp.y, tp.m) + '</span></div>' +
      '<div class="report">' + esc(reportText(C)) + '</div>' +
      '<div style="margin-top:12px"><button type="button" class="btn ghost" data-action="an-report">レポートを文字でコピーする</button></div></div>';
    return h;
  }
  function monthEndHtml() {
    var today = todayStr(), cp = periodOf(today), pr = periodRange(cp.y, cp.m), left = Math.round((parseD(pr.to) - parseD(today)) / 86400000);
    var target = null, msg = '';
    if (left <= 2) { target = cp; msg = cp.m + '月分も、もうすぐ終わりです。'; }
    else if (datesBetween(pr.from, today).length <= 2) { target = periodShift(cp, -1); msg = target.m + '月分が終わりました。'; }
    if (!target || !state.records.some(function (r) { return r.type === 'expense' || r.type === 'income'; })) return '';
    return '<div class="note y"><b>' + msg + '</b><br>収支と、お金の使い方のまとめを見られます。' +
      '<div style="margin-top:10px"><button type="button" class="btn small" data-action="open-tips" data-y="' + target.y + '" data-m="' + target.m + '">月末のレポートを見る</button></div></div>';
  }

  var AN_LABEL = { expense: '使ったお金', income: '収入', plan: '予定' };
  var DONUT_MAX = 5, REST_KEY = '\u0000rest';

  function lastDayStr(y, m) { return y + '-' + pad(m) + '-' + pad(new Date(y, m, 0).getDate()); }
  function jpDate(str) { var p = str.split('-').map(Number); return p[0] + '年' + p[1] + '月' + p[2] + '日'; }
  function pctText(amount, total) {
    if (!total) return '0%';
    var p = amount / total * 100;
    return p > 0 && p < 1 ? '1%未満' : Math.round(p) + '%';
  }
  function compactYen(n) {
    if (n >= 100000000) return Math.round(n / 1000000) / 100 + '億円';
    if (n >= 10000) { var v = n / 10000; return (v >= 100 ? Math.round(v) : Math.round(v * 10) / 10) + '万円'; }
    return fmt(n) + '円';
  }
  function anRange() {
    var a = ui.an;
    if (a.mode === 'month') { var pr = periodRange(a.y, a.m); return { ok: true, from: pr.from, to: pr.to }; }
    if (!validDate(a.from) || !validDate(a.to)) return { ok: false, msg: '開始日と終わりの日を選んでください。' };
    if (a.to < a.from) return { ok: false, msg: '終わりの日は、開始日と同じか、それより後にしてください。' };
    return { ok: true, from: a.from, to: a.to };
  }
  function anPresetRange(p) {
    var cp = periodOf(todayStr()), cur = periodRange(cp.y, cp.m), q;
    if (p === 'this') return { from: cur.from, to: cur.to };
    if (p === 'last') { q = periodShift(cp, -1); return periodRange(q.y, q.m); }
    if (p === 'three') { q = periodShift(cp, -2); return { from: periodRange(q.y, q.m).from, to: cur.to }; }
    var yy = new Date().getFullYear();
    return { from: yy + '-01-01', to: yy + '-12-31' };
  }
  // 期間(from〜to、どちらの日も含む)に入る、その種類の記録
  function anRecords(kind, from, to) {
    return state.records.filter(function (r) {
      if (r.date < from || r.date > to) return false;
      if (kind === 'plan') return isOpenPlan(r);
      return r.type === kind;
    });
  }
  function anAggregate(kind, from, to) {
    var list = anRecords(kind, from, to), map = Object.create(null), order = [];
    list.forEach(function (r) {
      var k = r.catName || 'その他';
      if (!map[k]) { map[k] = { name: k, amount: 0, count: 0 }; order.push(k); }
      map[k].amount += r.amount; map[k].count++;
    });
    var cats = order.map(function (k) { return map[k]; }).sort(function (p, q) { return q.amount - p.amount || (p.name < q.name ? -1 : 1); });
    return { total: sumOf(list), count: list.length, cats: cats };
  }
  // 円グラフの切り分け: 多い順に5つまで色つき、残りは「ほか」1つにまとめる
  function anSlices(cats) {
    var slices = [], rest = null;
    cats.forEach(function (c, i) {
      if (i < DONUT_MAX) slices.push({ key: c.name, name: c.name, amount: c.amount, count: c.count, slot: i + 1 });
      else {
        if (!rest) rest = { key: REST_KEY, name: '', amount: 0, count: 0, slot: 0, n: 0, only: c.name };
        rest.amount += c.amount; rest.count += c.count; rest.n++;
      }
    });
    if (rest) { rest.name = rest.n === 1 ? rest.only : 'ほか' + rest.n + '個'; slices.push(rest); }
    return slices;
  }
  // 棒グラフの6期間分。予定は先を見たいので、開始の期間から6期間先まで。ほかは終わりの期間までの6期間。
  function anMonths(kind, rng) {
    var i, out = [], p = kind === 'plan' ? periodOf(rng.from) : periodShift(periodOf(rng.to), -5);
    for (i = 0; i < 6; i++) {
      var pr = periodRange(p.y, p.m);
      out.push({ y: p.y, m: p.m, ym: ymKey(p.y, p.m), inRange: pr.from <= rng.to && pr.to >= rng.from, amount: sumOf(anRecords(kind, pr.from, pr.to)) });
      p = periodShift(p, 1);
    }
    return out;
  }

  function donutHtml(slices, agg, selCat, selKey, kind) {
    var R = 70, C = 2 * Math.PI * R, gap = slices.length > 1 ? 2 : 0, pos = 0, arcs = '', desc = [];
    slices.forEach(function (sl) {
      var len = sl.amount / agg.total * C, draw = Math.max(len - gap, 0.5), dim = selKey && sl.key !== selKey;
      arcs += '<circle cx="100" cy="100" r="' + R + '" fill="none" stroke-width="30" style="stroke:var(' + (sl.slot ? '--c' + sl.slot : '--c-other') + ');' + (dim ? 'opacity:.28' : '') + '" ' +
        'stroke-dasharray="' + draw.toFixed(2) + ' ' + (C - draw).toFixed(2) + '" stroke-dashoffset="' + (-(pos + gap / 2)).toFixed(2) + '"></circle>';
      pos += len;
      desc.push(sl.name + ' ' + pctText(sl.amount, agg.total));
    });
    var center = selCat
      ? '<span class="dc-l">' + esc(selCat.name) + '</span>' + yen(selCat.amount, 'dc-n') + '<span class="dc-l">' + pctText(selCat.amount, agg.total) + '</span>'
      : '<span class="dc-l">合計</span>' + yen(agg.total, 'dc-n') + '<span class="dc-l">' + agg.count + '件</span>';
    return '<div class="donut"><svg viewBox="0 0 200 200" role="img" aria-label="' + esc(AN_LABEL[kind] + 'のカテゴリー別の割合。' + desc.join('、')) + '"><g transform="rotate(-90 100 100)">' + arcs + '</g></svg>' +
      '<div class="donut-c">' + center + '</div></div>';
  }
  function anRowsHtml(agg, selCat) {
    var max = agg.cats.length ? agg.cats[0].amount : 1;
    return '<ul class="list" style="margin-top:4px">' + agg.cats.map(function (c, i) {
      var slot = i < DONUT_MAX ? i + 1 : 0, w = Math.max(2, Math.round(c.amount / max * 100)), on = !!selCat && selCat.name === c.name;
      return '<li><button type="button" class="an-row" style="--dot:var(' + (slot ? '--c' + slot : '--c-other') + ')" data-action="an-sel" data-key="' + esc(c.name) + '" aria-pressed="' + on + '">' +
        '<span class="an-line"><span class="dot" aria-hidden="true"></span><span class="nm">' + esc(c.name) + '<small class="ct">' + c.count + '件</small></span>' + yen(c.amount) + '<span class="pc">' + pctText(c.amount, agg.total) + '</span></span>' +
        '<span class="track" aria-hidden="true"><span class="fill" style="width:' + w + '%"></span></span></button></li>';
    }).join('') + '</ul>';
  }
  function trendHtml(kind, rng) {
    var a = ui.an, months = anMonths(kind, rng), max = 0;
    months.forEach(function (o) { if (o.amount > max) max = o.amount; });
    var fp = periodOf(kind === 'plan' ? rng.from : rng.to), focusYm = a.bar || ymKey(fp.y, fp.m);
    var fo = months.filter(function (o) { return o.ym === focusYm; })[0] || months[months.length - 1];
    var cols = months.map(function (o) {
      var hh = max > 0 ? Math.round(o.amount / max * 100) : 0;
      if (o.amount > 0 && hh < 3) hh = 3;
      var on = a.bar === o.ym, showVal = o.ym === fo.ym;
      return '<button type="button" class="col" data-action="an-bar" data-ym="' + o.ym + '" data-in="' + (o.inRange ? 1 : 0) + '" aria-pressed="' + on + '" aria-label="' + o.y + '年' + o.m + '月分の' + AN_LABEL[kind] + ' ' + fmt(o.amount) + '円">' +
        '<span class="cv">' + (showVal ? compactYen(o.amount) : '') + '</span><span class="well"><span class="bar" style="height:' + hh + '%"></span></span><span class="mo">' + o.m + '月分</span></button>';
    }).join('');
    var table = months.map(function (o) { return '<div class="kv"><span>' + o.y + '年' + o.m + '月分</span>' + yen(o.amount) + '</div>'; }).join('');
    return '<div class="card an-' + kind + '"><div class="sec-head"><h2>月ごとの推移</h2><span class="sub">1か月（期間）ぶんの合計</span></div>' +
      '<p class="label" style="margin:0 0 6px" aria-live="polite">' + fo.y + '年' + fo.m + '月分の' + AN_LABEL[kind] + '　' + yen(fo.amount) + '</p>' +
      '<div class="cols">' + cols + '</div>' +
      '<p class="sub" style="margin:6px 0 0">' + (kind === 'plan' ? '予定の日で数えています。' : '') + '濃い色が、選んでいる期間です。棒をタップすると金額が出ます。</p>' +
      '<details class="tbl"><summary>数字で見る</summary>' + table + '</details></div>';
  }

  function renderAnalysis() {
    var a = ui.an, kind = a.kind, isMonth = a.mode === 'month', rng = anRange(), h = '';
    h += '<div class="seg three" role="tablist" aria-label="分析の見かた">' +
      '<button type="button" role="tab" data-action="an-view" data-view="stats" aria-selected="' + (a.view !== 'compare' && a.view !== 'tips') + '">集計</button>' +
      '<button type="button" role="tab" data-action="an-view" data-view="compare" aria-selected="' + (a.view === 'compare') + '">予定と実際</button>' +
      '<button type="button" role="tab" data-action="an-view" data-view="tips" aria-selected="' + (a.view === 'tips') + '">節約のヒント</button></div>';
    h += '<div class="card"><div class="sec-head"><h2>期間</h2><span class="sub">月ごと、または自由に</span></div>' +
      '<div class="seg" role="tablist" aria-label="集計のしかた">' +
        '<button type="button" role="tab" data-action="an-mode" data-mode="month" aria-selected="' + isMonth + '">月ごと</button>' +
        '<button type="button" role="tab" data-action="an-mode" data-mode="range" aria-selected="' + !isMonth + '">期間を決める</button></div>';
    if (isMonth) {
      h += '<div class="month" style="margin-top:12px"><button type="button" data-action="an-nav" data-dir="-1" aria-label="前の期間">‹</button><h2>' + periodHead(a.y, a.m) + '</h2><button type="button" data-action="an-nav" data-dir="1" aria-label="次の期間">›</button></div>';
    } else {
      var presets = [['this', '今の期間'], ['last', '前の期間'], ['three', '直近3期間'], ['year', '今年']];
      h += '<div class="range-fields" style="margin-top:12px">' +
          '<div class="field"><label for="an-from">開始日</label><input id="an-from" type="date" data-an="from" value="' + esc(a.from) + '"></div>' +
          '<div class="field"><label for="an-to">終わりの日</label><input id="an-to" type="date" data-an="to" value="' + esc(a.to) + '"></div></div>' +
        '<div class="presets" style="margin-top:10px">' + presets.map(function (p) {
          var r = anPresetRange(p[0]);
          return '<button type="button" data-action="an-preset" data-p="' + p[0] + '" aria-pressed="' + (r.from === a.from && r.to === a.to) + '">' + p[1] + '</button>';
        }).join('') + '</div>';
      if (!rng.ok) h += '<div class="err" role="alert" style="margin-top:8px">' + esc(rng.msg) + '</div>';
    }
    h += '</div>';
    if (!rng.ok) { $('screen-analysis').innerHTML = h; return; }
    if (a.view === 'compare') { $('screen-analysis').innerHTML = h + compareHtml(rng, isMonth); return; }
    if (a.view === 'tips') { $('screen-analysis').innerHTML = h + tipsHtml(rng, isMonth); return; }

    var inc = anAggregate('income', rng.from, rng.to), exp = anAggregate('expense', rng.from, rng.to), pln = anAggregate('plan', rng.from, rng.to);
    var agg = kind === 'expense' ? exp : kind === 'income' ? inc : pln;
    var title = isMonth ? periodLabel(a.y, a.m) + '（' + rangeText(rng) + '）' : jpDate(rng.from) + '〜' + jpDate(rng.to);

    h += '<div class="trio">' +
        '<div class="note g"><p class="label">収入</p>' + yen(inc.total) + '</div>' +
        '<div class="note p"><p class="label">使った</p>' + yen(exp.total) + '</div>' +
        '<div class="note b"><p class="label">これから払う</p>' + yen(pln.total) + '</div></div>' +
      '<div class="card"><div class="formula" style="margin:0;padding:0;border-top:0">' +
        '<div><span>収入</span>' + yen(inc.total) + '</div><div><span>− 使ったお金</span>' + yen(exp.total) + '</div>' +
        '<div style="margin-top:6px;padding-top:8px;border-top:2px dashed var(--line)"><span><b>収支</b></span>' + yen(inc.total - exp.total, 'mid') + '</div>' +
        '<p class="hint">「これから払う」は、まだ払っていない予定（' + pln.count + '件）です。収支や「使った」には入れていません。支払い済みにした分は「使った」に入っています。</p></div></div>' +
      '<div class="seg three" role="tablist" aria-label="集計する種類">' + ['expense', 'income', 'plan'].map(function (k) {
        return '<button type="button" role="tab" data-action="an-kind" data-kind="' + k + '" aria-selected="' + (kind === k) + '">' + AN_LABEL[k] + '</button>';
      }).join('') + '</div>';

    h += '<div class="card an-' + kind + '"><div class="sec-head" style="flex-wrap:wrap"><h2>カテゴリー別の' + AN_LABEL[kind] + '</h2><span class="sub">' + title + '</span></div>';
    if (!agg.cats.length) {
      h += '<p class="sub" style="margin:0">この期間の' + (kind === 'plan' ? '「予定」（まだ払っていないもの）' : '「' + AN_LABEL[kind] + '」') + 'の記録はありません。</p>';
    } else {
      var selCat = a.sel ? (agg.cats.filter(function (c) { return c.name === a.sel; })[0] || null) : null;
      var selKey = selCat ? (agg.cats.indexOf(selCat) < DONUT_MAX ? selCat.name : REST_KEY) : null;
      h += donutHtml(anSlices(agg.cats), agg, selCat, selKey, kind) +
        '<p class="sub" style="margin:0 0 4px;text-align:center">カテゴリーをタップすると、円グラフの中に出ます。</p>' + anRowsHtml(agg, selCat);
    }
    h += '</div>' + trendHtml(kind, rng);
    $('screen-analysis').innerHTML = h;
  }

  function anRefocus(el) {
    var list = $('screen-analysis').querySelectorAll('[data-action="' + el.dataset.action + '"]'), i;
    for (i = 0; i < list.length; i++) {
      var hit = true;
      ['key', 'ym', 'mode', 'kind', 'p', 'dir', 'view', 'id'].forEach(function (k) { if ((list[i].dataset[k] || '') !== (el.dataset[k] || '')) hit = false; });
      if (hit) { if (list[i].focus) list[i].focus(); return; }
    }
  }
  function anAct(act, el) {
    var an = ui.an, d = el.dataset, nm, ny;
    if (act === 'an-sel') { an.sel = an.sel === d.key ? null : d.key; renderAnalysis(); anRefocus(el); return; }
    if (act === 'an-bar') { an.bar = an.bar === d.ym ? null : d.ym; renderAnalysis(); anRefocus(el); return; }
    if (act === 'an-cher') { toggleCherish(d.id); renderAnalysis(); anRefocus(el); return; }
    if (act === 'an-report') { var rp = reportFor(); openCopySheet('今期のレポート', 'コピーして、メモアプリなどに貼り付けて保存できます。数字は、この家計簿の記録から計算したものです。', rp, 'report'); return; }
    if (act === 'an-view') { an.view = d.view === 'compare' ? 'compare' : d.view === 'tips' ? 'tips' : 'stats'; an.sel = null; an.bar = null; renderAnalysis(); anRefocus(el); return; }
    if (act === 'an-mode') {
      if (d.mode === 'range' && an.mode === 'month') { var pr0 = periodRange(an.y, an.m); an.from = pr0.from; an.to = pr0.to; }
      an.mode = d.mode;

      h += '<div class="field"><label for="f-datekind">日付の種類</label><select id="f-datekind" data-field="dateKind"><option value="purchase"' + (d.dateKind === 'purchase' ? ' selected' : '') + '>購入予定日</option><option value="due"' + (d.dateKind === 'due' ? ' selected' : '') + '>支払い期限</option></select></div>';
    }
    h += '<div class="field"><label for="f-date">' + (conv ? '支払った日' : '日付') + '</label><input id="f-date" data-field="date" type="date" value="' + esc(d.date) + '"' + (e.date ? ' aria-invalid="true"' : '') + ' aria-describedby="e-date"><div class="err" id="e-date" role="alert">' + esc(e.date || '') + '</div></div>';
    if (!conv) {
      h += '<div class="field"><label for="f-cat">カテゴリー</label><select id="f-cat" data-field="catId">' + catOptions(d) + '</select></div>';
      h += '<div class="field"><label for="f-name">名称</label><input id="f-name" data-field="name" type="text" maxlength="60" autocomplete="off" placeholder="' + (d.type === 'income' ? '例：10月分アルバイト' : d.type === 'plan' ? '例：ライブのチケット代' : '例：スーパーで買い出し') + '" value="' + esc(d.name) + '"></div>';
    }
    h += '<div class="field"><label for="f-memo">メモ</label><textarea id="f-memo" data-field="memo" maxlength="500" placeholder="あとで見返すメモ（なくてもOK）">' + esc(d.memo) + '</textarea></div>';
    if (isPlan && !conv) {
      if (d.status !== 'paid') h += '<div class="field"><label for="f-status">支払い状況</label><select id="f-status" data-field="status">' +
        opt('unpaid', '未払い（払うことが決まっている）', d.status) + opt('considering', '検討中（買うか迷っている）', d.status) + (add ? '' : opt('cancelled', '取り消し（買わないことにした）', d.status)) + '</select>' + (d.status === 'cancelled' ? '<div class="sub">取り消した予定は、どの合計にも入りません。「未払い」にもどすと、また予定に入ります。</div>' : '') + '</div>';

    if (d.mode === 'edit' && d.confirmDelete && d.fromPlanId && findRec(d.fromPlanId)) h += '<div class="note p" role="alert">この記録を削除します。元の予定は、どうしますか？「未払いにもどす」なら、また予定に入ります。「取り消す」なら、どの合計にも入りません。</div>';
    h += '<div class="actions"><button type="submit" class="btn">' + (conv ? '支払い済みにする' : (add ? '記録する' : '保存する')) + '</button>' +
      '<button type="button" class="btn ghost" data-action="close-sheet">キャンセル</button>';
    if (d.mode === 'edit' && !(isPlan && d.status === 'paid')) {
      var hasPl = !!(d.fromPlanId && findRec(d.fromPlanId));
      if (d.confirmDelete) {
        h += hasPl
          ? '<button type="button" class="btn ghost danger" data-action="delete">削除して、予定を未払いにもどす</button><button type="button" class="btn ghost danger" data-action="delete-cancel">削除して、予定も取り消す</button>'
          : '<button type="button" class="btn ghost danger" data-action="delete">本当に削除する</button>';
      } else h += '<button type="button" class="btn ghost danger" data-action="ask-delete">削除する</button>';
