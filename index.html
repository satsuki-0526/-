    if (focusSel) { var el = $('sheet').querySelector('[aria-invalid="true"]') || $('sheet').querySelector(focusSel); if (el && el.focus) el.focus(); }
  }
  function updatePreview() {
    var el = $('amt-preview'); if (!el || !ui.sheet) return;
    var n = parseAmount(ui.sheet.amount);
    el.textContent = isNaN(n) ? '' : fmt(n) + '円';
    var cl = $('cmp-live');
    if (cl) {
      var d = ui.sheet, pa = d.mode === 'convert' ? d.planAmount : (d.fromPlanId && findRec(d.fromPlanId) ? findRec(d.fromPlanId).amount : null);
      cl.innerHTML = (pa == null || isNaN(n)) ? '' : cmpBlockHtml(pa, n);
    }
  }

  function focusIn(sel) {
    if (!sel) return;
    var box = $('sheet');
    var el = box.querySelector('[aria-invalid="true"]') || box.querySelector(sel);
    if (el && el.focus) el.focus();
  }

  /* ============ 電卓 ============
     式は文字の並び("1200+300×2")として持ち、かけ算・わり算を先に計算します。 */
  var OPS = { '+': 1, '−': 1, '×': 2, '÷': 2 };
  function calcEval(expr) {
    var toks = expr.match(/\d+\.?\d*|\.\d+|[+−×÷]/g) || [];
    if (toks[0] === '−') toks.unshift('0');
    while (toks.length && OPS[toks[toks.length - 1]]) toks.pop();
    if (!toks.length) return { ok: false, msg: '' };
    var vals = [Number(toks[0])], ops = [], i;
    if (isNaN(vals[0])) return { ok: false, msg: '式をたしかめてください。' };
    for (i = 1; i < toks.length; i += 2) {
      var v = Number(toks[i + 1]);
      if (!OPS[toks[i]] || isNaN(v)) return { ok: false, msg: '式をたしかめてください。' };
      ops.push(toks[i]); vals.push(v);
    }
    var v2 = [vals[0]], o2 = [];
    for (i = 0; i < ops.length; i++) {
      if (ops[i] === '×' || ops[i] === '÷') {
        var a = v2.pop(), b = vals[i + 1];
        if (ops[i] === '÷' && b === 0) return { ok: false, msg: '0では割れません。' };
        v2.push(ops[i] === '×' ? a * b : a / b);
      } else { o2.push(ops[i]); v2.push(vals[i + 1]); }
    }
    var r = v2[0];
    for (i = 0; i < o2.length; i++) r = o2[i] === '+' ? r + v2[i + 1] : r - v2[i + 1];
    if (!isFinite(r) || Math.abs(r) > 1e12) return { ok: false, msg: '大きすぎて計算できません。' };
    return { ok: true, value: Math.round(r * 1e6) / 1e6 };
  }
  function calcFmt(v) { return (v < 0 ? '−' : '') + Math.abs(v).toLocaleString('ja-JP', { maximumFractionDigits: 6 }); }

  var CALC_KEYS = [
    ['C', 'fn', '全部消す', 'C'], ['÷', 'op', '割る'], ['×', 'op', '掛ける'], ['back', 'fn', '1つ戻る', '⌫'],
    ['7'], ['8'], ['9'], ['−', 'op', '引く'],
    ['4'], ['5'], ['6'], ['+', 'op', '足す'],
    ['1'], ['2'], ['3'], ['=', 'eq', '計算する'],
    ['0'], ['00'], ['.', '', '小数点']
  ];
  function renderCalcSheet(focusSel) {
    var d = ui.sheet, c = d.calc;
    var r = calcEval(c.expr);
    var body = c.expr.replace(/^−/, '');
    var hasOp = /[+−×÷]/.test(body), trailing = !!OPS[c.expr.slice(-1)];
    var exprText = c.expr.replace(/([+−×÷])/g, ' $1 ').trim();
    var resultText = r.ok ? (hasOp && !trailing ? '= ' : '') + calcFmt(r.value) + '円' : '0';
    var keys = CALC_KEYS.map(function (k) {
      return '<button type="button" class="key ' + (k[1] || '') + '" data-action="calc-key" data-key="' + k[0] + '"' + (k[2] ? ' aria-label="' + k[2] + '"' : '') + '>' + (k[3] || k[0]) + '</button>';
    }).join('');
    $('sheet').innerHTML =
      '<h2 id="sheetTitle">電卓</h2>' +
      '<div class="calc-display" aria-live="polite"><div class="calc-expr">' + esc(exprText) + '</div><div class="calc-result">' + esc(resultText) + '</div></div>' +
      '<div class="err" id="e-calc" role="alert">' + esc(c.error || '') + '</div>' +
      '<div class="keys">' + keys + '</div>' +
      '<div class="actions"><button type="button" class="btn" data-action="calc-apply">この金額を入力する</button>' +
      '<button type="button" class="btn ghost" data-action="calc-close">電卓を閉じる</button></div>';
    focusIn(focusSel);
  }
  function calcPress(key) {
    var c = ui.sheet.calc, e = c.expr, last = e.slice(-1), next = e;
    c.error = '';
    var num = (e.match(/[\d.]*$/) || [''])[0];
    if (key === 'C') next = '';
    else if (key === 'back') next = e.slice(0, -1);
    else if (key === '=') {
      var r = calcEval(e);
      if (r.ok) next = (r.value < 0 ? '−' : '') + String(Math.abs(r.value));
      else c.error = r.msg;
    }
    else if (OPS[key]) {
      if (e === '') { if (key === '−') next = '−'; }
      else if (e !== '−') {
        var base = last === '.' ? e.slice(0, -1) : e;
        next = OPS[base.slice(-1)] ? base.slice(0, -1) + key : base + key;
      }
    }
    else if (key === '00') { if (num === '') next = e + '0'; else if (num !== '0') next = e + '00'; }
    else if (key === '.') { if (num.indexOf('.') < 0) next = e + (num === '' ? '0.' : '.'); }
    else if (/^\d$/.test(key)) { next = num === '0' ? e.slice(0, -1) + key : e + key; }
    if (next.length > 40) next = e;
    c.expr = next;
    renderCalcSheet('[data-key="' + key + '"]');
  }
  function openCalc() {
    var d = ui.sheet, n = parseAmount(d.amount);
    d.calc = { expr: isNaN(n) ? '' : String(n), error: '' };
    renderSheet('[data-key="C"]');
  }
  function closeCalc() {
    ui.sheet.calc = null;
    renderSheet('[data-action="open-calc"]');
  }
  function calcApply() {
    var d = ui.sheet, c = d.calc, r = calcEval(c.expr);
    if (!r.ok) { c.error = r.msg || '数字を入力してください。'; renderCalcSheet(); return; }
    var n = Math.round(r.value);
    if (n < 1) { c.error = '金額は1円以上にしてください。'; renderCalcSheet(); return; }
    if (n > MAX_AMOUNT) { c.error = '金額は' + fmt(MAX_AMOUNT) + '円までです。'; renderCalcSheet(); return; }
    d.amount = String(n); d.calc = null;
    if (d.errors) delete d.errors.amount;
    renderSheet('.actions .btn');
    if (r.value !== n) toast('小数点以下は四捨五入して' + fmt(n) + '円にしました');
  }

  /* ============ カテゴリー ============
     記録には、カテゴリーの id と、名前(catName)の両方を残しています。
     名前を変えたとき: そのカテゴリーの記録の名前も新しくなります(金額・日付はそのまま)。
     削除したとき: 記録は消さず、その時の名前のまま残ります。 */
  function normName(s) { return String(s == null ? '' : s).replace(/[\s　]+/g, ' ').trim(); }
  function catCount(id) { return state.records.filter(function (r) { return r.catId === id; }).length; }
  function catNameTaken(kind, name, exceptId) {
    return state.categories.some(function (c) { return c.kind === kind && c.id !== exceptId && c.name === name; });
  }
  function addCategory(kind, name) {
    var c = { id: (kind === 'income' ? 'i' : 'x') + newId(), name: name, kind: kind };
    state.categories.push(c);
    return c;
  }
  function renameCategory(id, name) {
    var c = catById(id); if (!c) return;
    c.name = name;
    state.records.forEach(function (r) { if (r.catId === id) r.catName = name; });
    (state.fixed || []).forEach(function (f) { if (f.catId === id) f.catName = name; });
  }
  function deleteCategory(id) {
    var c = catById(id); if (!c) return false;
    var same = state.categories.filter(function (x) { return x.kind === c.kind; });
    if (same.length <= 1) return false;
    state.categories = state.categories.filter(function (x) { return x.id !== id; });
    return true;
  }
  function renderCatSheet(focusSel) {
    var d = ui.sheet, e = d.errors || {}, add = d.mode === 'cat-add';
    var kindLabel = d.catKind === 'income' ? '収入' : '使ったお金・予定';
    var cnt = add ? 0 : catCount(d.id);
    var h = '<h2 id="sheetTitle">' + (add ? 'カテゴリーを追加' : 'カテゴリーを編集') + '</h2>' +
      '<form id="sheetForm" novalidate style="display:grid;gap:14px">' +
      '<div class="note b">「' + kindLabel + '」で選ぶカテゴリーです。</div>' +
      '<div class="field"><label for="f-catname">名前（20文字まで）</label>' +
        '<input id="f-catname" data-field="name" type="text" maxlength="20" autocomplete="off" placeholder="例：推し活" value="' + esc(d.name) + '"' + (e.name ? ' aria-invalid="true"' : '') + ' aria-describedby="e-catname">' +
        '<div class="err" id="e-catname" role="alert">' + esc(e.name || '') + '</div></div>';
    if (!add) h += '<p class="memo">このカテゴリーを使った記録は' + cnt + '件あります。名前を変えると、過去の記録のカテゴリー名も新しい名前になります。金額や日付は変わりません。</p>';
    if (d.confirmDelete) h += '<div class="note p" role="alert">「' + esc(d.origName) + '」を削除します。' + cnt + '件の記録は消えず、「' + esc(d.origName) + '」という名前のまま残ります。このカテゴリーは選べなくなり、元に戻せません。</div>';
    h += '<div class="actions"><button type="submit" class="btn">' + (add ? '追加する' : '保存する') + '</button>' +
      '<button type="button" class="btn ghost" data-action="close-sheet">キャンセル</button>';
    if (!add) h += d.confirmDelete
      ? '<button type="button" class="btn ghost danger" data-action="delete">本当に削除する</button>'
      : '<button type="button" class="btn ghost danger" data-action="ask-delete">削除する</button>';
    h += '</div></form>';
    $('sheet').innerHTML = h;
    focusIn(focusSel);
  }

  function submitSheet() {
    var d = ui.sheet; if (!d) return;
    if (d.mode === 'cat-add' || d.mode === 'cat-edit') {
      var nm = normName(d.name), cerr = {};
      if (!nm) cerr.name = '名前を入力してください。';
      else if (nm.length > 20) cerr.name = '名前は20文字までです。';
      else if (catNameTaken(d.catKind, nm, d.id)) cerr.name = '同じ名前のカテゴリーがすでにあります。';
      if (cerr.name) { d.errors = cerr; renderSheet('#f-catname'); return; }
      var cmsg;
      if (d.mode === 'cat-add') { addCategory(d.catKind, nm); cmsg = '「' + nm + '」を追加しました'; }
      else { renameCategory(d.id, nm); cmsg = '「' + nm + '」に保存しました'; }
      save(); closeSheet(); render();
      toast(storageOK ? cmsg : '変更しましたが、保存できていません');
      return;
    }
    if (d.mode === 'fixed-add' || d.mode === 'fixed-edit') { submitFixed(d); return; }
    if (d.mode === 'budget') { submitBudget(d); return; }
    var amt = parseAmount(d.amount), errs = {};
    if (isNaN(amt) || amt < 1) errs.amount = '金額を1円以上の数字で入力してください。';
    else if (amt > MAX_AMOUNT) errs.amount = '金額は' + fmt(MAX_AMOUNT) + '円までです。';
    if (!validDate(d.date)) errs.date = '日付を選んでください。';
    if (errs.amount || errs.date) { d.errors = errs; renderSheet('#f-amount'); return; }
    var msg;
    if (d.mode === 'add') { var nr = addRecord(d, amt); msg = '記録しました' + budgetAlert(nr); }
    else if (d.mode === 'convert') {
      var pl0 = findRec(d.id), pamt = pl0 ? pl0.amount : amt, ex = convertPlan(d.id, d, amt);
      msg = ex ? '支払い済みにしました。使ったお金に記録しました。' + (pamt === amt ? '予定どおりでした' : pamt > amt ? '予定より' + fmt(pamt - amt) + '円安く済みました' : '予定より' + fmt(amt - pamt) + '円高くなりました') + budgetAlert(ex) : 'この予定は、すでに支払い済みか、取り消されています';
    }
    else {
      var r = findRec(d.id);
      if (r) {
        applyDraft(r, d, amt);
        if (r.type === 'expense' && r.fromPlanId) { var pp = findRec(r.fromPlanId); if (pp) pp.paidDate = r.date; }   // 支払った日をそろえる
      }
      msg = '更新しました';
    }
    save(); closeSheet(); render();
    toast(storageOK ? msg : '記録しましたが、保存できていません', msg.indexOf('予算') >= 0 ? 5200 : 0);
  }

  /* ============ 画面の切り替えと操作 ============ */
  var TITLES = { home: 'ホーム', records: '記録', calendar: '手帳', plans: '予定', analysis: '分析', settings: '設定' };
  function go(tab) {
    ui.tab = tab;
    Object.keys(TITLES).forEach(function (k) { $('screen-' + k).hidden = (k !== tab); });
    document.querySelectorAll('.tabs button').forEach(function (b) {
      if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    $('screenTitle').textContent = TITLES[tab];
    $('main').scrollTop = 0;
  }
  var toastTimer;
  function toast(msg, ms) {
    var t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, ms || 2800);
  }

  document.addEventListener('click', function (ev) {
    if (ev.target === $('sheetWrap')) { if (ui.sheet && ui.sheet.calc) closeCalc(); else closeSheet(); return; }
    var el = ev.target.closest('[data-action]');
    if (!el) return;
    if (notePending) flushNote();
    var a = el.dataset.action;
    if (a === 'tab') go(el.dataset.tab);
    else if (a === 'add') openSheet(newDraft(el.dataset.type));
    else if (a === 'edit') {
      var r = findRec(el.dataset.id); if (!r) return;
      if (r.type === 'plan' && r.status === 'paid') { var e = findRec(r.expenseId); if (e) { openSheet(editDraft(e)); return; } r.status = 'unpaid'; save(); render(); toast('支払い記録が見つからないため、予定を未払いに戻しました'); return; }
      openSheet(editDraft(r));
    }
    else if (a === 'convert') { var p = findRec(el.dataset.id); if (p && isOpenPlan(p)) openSheet(convertDraft(p)); }
    else if (a === 'edit-plan') { var ep = findRec(el.dataset.id); if (ep && ep.type === 'plan') openSheet(editDraft(ep)); }
    else if (a === 'cancel-plan') {
      var cpl = findRec(el.dataset.id);
      if (cpl && isOpenPlan(cpl)) { cpl.status = 'cancelled'; save(); render(); toast(storageOK ? '予定を取り消しました。「取り消した予定」から、もとにもどせます' : '変更しましたが、保存できていません', 4200); }
    }
    else if (a === 'restore-plan') {
      var rpl = findRec(el.dataset.id);
      if (rpl && rpl.type === 'plan' && rpl.status === 'cancelled') { rpl.status = 'unpaid'; save(); render(); toast(storageOK ? '予定にもどしました' : '変更しましたが、保存できていません'); }
    }
    else if (a === 'open-tips') { ui.an.mode = 'month'; ui.an.y = Number(el.dataset.y); ui.an.m = Number(el.dataset.m); ui.an.view = 'tips'; ui.an.sel = null; ui.an.bar = null; go('analysis'); renderAnalysis(); }
    else if (a === 'open-compare') { ui.an.view = 'compare'; go('analysis'); renderAnalysis(); }
    else if (a === 'kind') { ui.kind = el.dataset.kind; renderRecords(); }
    else if (a === 'month') {
      var n = ui.ym.m + Number(el.dataset.dir), y = ui.ym.y;
      if (n < 1) { n = 12; y--; } else if (n > 12) { n = 1; y++; }
      ui.ym = { y: y, m: n }; renderRecords();
    }
    else if (a === 'sheet-type') { ui.sheet.type = el.dataset.type; ui.sheet.catId = firstCat(ui.sheet.type); ui.sheet.catName = ''; renderSheet('[data-action="sheet-type"][aria-pressed="true"]'); }
    else if (a === 'close-sheet') closeSheet();
    else if (a === 'ask-delete') {
      var sd = ui.sheet;
      if (sd.mode === 'cat-edit' && state.categories.filter(function (x) { return x.kind === sd.catKind; }).length <= 1) {
        sd.errors = { name: '最後の1つは削除できません。先に別のカテゴリーを追加してください。' };
        renderSheet('#f-catname');
      } else { sd.confirmDelete = true; renderSheet('[data-action="delete"]'); }
    }
    else if (a === 'delete') {
      if (ui.sheet.mode === 'budget') { deleteBudgetEntry(ui.sheet.ym); save(); closeSheet(); render(); toast('この期間の予算の設定を取り消しました'); }
      else if (ui.sheet.mode === 'fixed-edit') { var fxName = ui.sheet.name; deleteFixed(ui.sheet.id); save(); closeSheet(); render(); toast('固定費「' + fxName + '」を削除しました。支払い済みの記録は残っています'); }
      else if (ui.sheet.mode === 'copy') { try { localStorage.removeItem(KEY + '.broken'); } catch (e4) {} closeSheet(); render(); toast('控えを削除しました'); }
      else if (ui.sheet.mode === 'cat-edit') {
        var delName = ui.sheet.origName;
        if (deleteCategory(ui.sheet.id)) { save(); closeSheet(); render(); toast('「' + delName + '」を削除しました。過去の記録は残っています'); }
      } else { deleteRecord(ui.sheet.id); save(); closeSheet(); render(); toast('削除しました'); }
    }
    else if (a === 'delete-cancel') {
      var dx = findRec(ui.sheet.id), dpid = dx && dx.fromPlanId;
      deleteRecord(ui.sheet.id);
      if (dpid) { var dpl = findRec(dpid); if (dpl && dpl.type === 'plan') dpl.status = 'cancelled'; }
      save(); closeSheet(); render(); toast('削除して、予定も取り消しました');
    }
    else if (a === 'backup-file') saveFile('kakeibo-backup-' + todayStr() + '.json', backupText(), 'backup');
    else if (a === 'backup-copy') openCopySheet('バックアップをコピー', 'コピーして、メモアプリなどに貼り付けて保存してください。復元するときは、その文字を貼り付けて使います。', backupText());
    else if (a === 'csv') saveFile('kakeibo-' + todayStr() + '.csv', buildCsv(), 'csv');
    else if (a === 'restore-open') openSheet({ mode: 'restore', text: '', fileName: '', error: '', parsed: null });
    else if (a === 'undo-restore') { var sn = readSnapshot(); if (sn) openSheet({ mode: 'restore', text: '', error: '', parsed: sn.res, fromSnapshot: true }); else toast('戻せる控えが見つかりません'); }
    else if (a === 'restore-check') restoreCheck();
    else if (a === 'restore-apply') restoreApply();
    else if (a === 'restore-back') { ui.sheet.parsed = null; renderSheet('#f-file'); }
    else if (a === 'copy-text') copyText();
    else if (a === 'broken-open') { var bk = readBroken(); if (bk) openCopySheet('読み込めなかったデータ', 'これは、前回うまく読み込めなかった記録の、そのままの内容です。コピーして、メモアプリなどに残してください。', bk, 'broken'); }
    else if (a === 'fixed-add') openSheet(newFixedDraft());
    else if (a === 'fixed-edit') { var fxe = findFixed(el.dataset.id); if (fxe) openSheet(editFixedDraft(fxe)); }
    else if (a === 'budget-edit') openBudgetSheet(ymKey(ui.budgetYm.y, ui.budgetYm.m));
    else if (a === 'bmonth') {
      var bn2 = ui.budgetYm.m + Number(el.dataset.dir), by = ui.budgetYm.y;
      if (bn2 < 1) { bn2 = 12; by--; } else if (bn2 > 12) { bn2 = 1; by++; }
      ui.budgetYm = { y: by, m: bn2 }; renderSettings();
    }
    else if (a.indexOf('an-') === 0) anAct(a, el);
    else if (a.indexOf('cal-') === 0) calAct(a, el);
    else if (a === 'open-calc') openCalc();
    else if (a === 'calc-key') calcPress(el.dataset.key);
    else if (a === 'calc-apply') calcApply();
    else if (a === 'calc-close') closeCalc();
    else if (a === 'cat-kind') { ui.catKind = el.dataset.kind; renderSettings(); }
    else if (a === 'cat-add') openSheet({ mode: 'cat-add', catKind: ui.catKind, name: '', errors: {}, confirmDelete: false });
    else if (a === 'cat-edit') {
      var cc = catById(el.dataset.id);
      if (cc) openSheet({ mode: 'cat-edit', id: cc.id, catKind: cc.kind, name: cc.name, origName: cc.name, errors: {}, confirmDelete: false });
    }
  });
  function applyField(el) {
    var d = ui.sheet; if (!d || !el.dataset) return;
    if (el.dataset.bcat) { if (d.vals) d.vals[el.dataset.bcat] = el.value; updateBudgetSum(); return; }
    var f = el.dataset.field; if (!f) return;
    d[f] = el.value;
    if (f === 'amount') updatePreview();
    if (f === 'total') updateBudgetSum();
    if (d.mode === 'fixed-add' || d.mode === 'fixed-edit') {
      if (f === 'ymonth') { var mx = MONTH_MAX[Number(el.value) - 1] || 31; if (Number(d.yday) > mx) d.yday = String(mx); }
      if (f === 'cycle') renderSheet('#f-cycle');
      else if (f === 'ymonth') renderSheet('#f-ymonth');
      else if (f === 'endMode') renderSheet('#f-endmode');
    }
  }
  document.addEventListener('input', function (ev) { applyField(ev.target); if (ev.target && ev.target.id === 'cal-note') onNoteInput(ev.target); });
  document.addEventListener('focusout', function (ev) { if (ev.target && ev.target.id === 'cal-note') flushNote(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) flushNote(); });
  window.addEventListener('pagehide', flushNote);
  document.addEventListener('submit', function (ev) { ev.preventDefault(); submitSheet(); });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t && t.dataset && t.dataset.setting === 'periodStart') { applyPeriodStart(Number(t.value)); return; }
    if (t && t.tagName === 'SELECT' && ui.sheet) { applyField(t); return; }
    if (!t || t.id !== 'f-file' || !ui.sheet || ui.sheet.mode !== 'restore') return;
    var f = t.files && t.files[0]; if (!f) return;
    if (f.size > 5 * 1024 * 1024) { ui.sheet.error = 'ファイルが大きすぎます（5MBまで）。'; renderSheet('#f-file'); return; }
    var fr = new FileReader();
    fr.onload = function () { if (ui.sheet && ui.sheet.mode === 'restore') { ui.sheet.text = String(fr.result || ''); ui.sheet.fileName = f.name; restoreCheck(); } };
    fr.onerror = function () { if (ui.sheet && ui.sheet.mode === 'restore') { ui.sheet.error = 'ファイルを読み込めませんでした。'; renderSheet('#f-file'); } };
    fr.readAsText(f);
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && ui.sheet) { if (ui.sheet.calc) closeCalc(); else closeSheet(); } });

  generateFixed();
  render();
  document.addEventListener('visibilitychange', function () { if (!document.hidden && generateFixed()) render(); });
</script>

</body></html>
